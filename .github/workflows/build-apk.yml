name: Build APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (armeabi-v7a compatible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "APK tidak ditemukan"; exit 1; }
          echo "APK: $APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E 'classes.dex|AndroidManifest' | head -5

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          OUT="http-download-manager-v${VER}-${CODE}.apk"
          cp "$APK" "$OUT"
          gh release delete "v${VER}" --yes --cleanup-tag || true
          gh release create "v${VER}" "$OUT" \
            --title "HTTP Download Manager v${VER}" \
            --notes "APK rilis terbaru. Unduh $OUT lalu pasang di HP.

- Beri izin Penyimpanan saat diminta.
- Aktifkan 'Instal dari sumber tidak dikenal' bila perlu." \
            --latest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: http-download-manager-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
