<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Manager Remote</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f2f4f8; margin: 0; padding: 16px; color: #1c1c1c; }
  .header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .header h1 { font-size: 20px; margin: 0; }
  .new-btn { white-space: nowrap; background: #FF6F00; }
  .hidden { display: none !important; }
  form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .form-row { display: flex; gap: 8px; }
  .form-row button { flex: 1; }
  .btn-ghost { background: #eef1f6; color: #1c1c1c; border: 1px solid #cbd2dd; }
  input, button { font-size: 15px; padding: 10px; border-radius: 8px; border: 1px solid #cbd2dd; }
  button { background: #0D47A1; color: #fff; border: none; cursor: pointer; }
  button:active { opacity: .8; }
  #status { color: #b00020; margin-bottom: 8px; font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .name { font-weight: 600; word-break: break-all; }
  .state { font-size: 13px; color: #555; margin: 4px 0 8px; }
  .err { color: #b00020; margin-top: 4px; }
  .bar { height: 8px; background: #e4e8ef; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
  .fill { height: 100%; background: #FF6F00; width: 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .actions a { padding: 6px 12px; font-size: 13px; text-decoration: none; border-radius: 8px; }
  a.stream { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
  a.dl { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
  select { font-size: 15px; padding: 10px; border-radius: 8px; border: 1px solid #cbd2dd; background: #fff; }
  #deviceStatus { background: #e8eaf6; border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #283593; margin-bottom: 10px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tools button { padding: 6px 12px; font-size: 13px; background: #eef1f6; color: #1c1c1c; border: 1px solid #cbd2dd; }
  #logBox { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 14px; }
  #logBox pre { background: #f6f7f9; border-radius: 8px; padding: 10px; font-size: 12px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  #logBox button { margin-top: 8px; }
  .actions button { padding: 6px 12px; font-size: 13px; background: #eef1f6; color: #1c1c1c; border: 1px solid #cbd2dd; }
  .gal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .gal-cell { position: relative; aspect-ratio: 1 / 1; background: #111; border-radius: 10px; overflow: hidden; cursor: pointer; }
  .gal-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gal-cell .gal-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .gal-cell .gal-play span { width: 0; height: 0; border-top: 18px solid transparent; border-bottom: 18px solid transparent; border-left: 28px solid rgba(255,255,255,.9); filter: drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
  .gal-cell .gal-name { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px; font-size: 11px; color: #fff; background: rgba(0,0,0,.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mediaModal { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 50; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 16px; }
  #mediaModal.open { display: flex; }
  #mediaModal img, #mediaModal video { max-width: 100%; max-height: 82vh; border-radius: 8px; }
  #mediaModal .m-actions { display: flex; gap: 10px; margin-top: 12px; }
  .gal-empty { padding: 24px; text-align: center; color: #666; }
</style>
</head>
<body>
<div class="header">
  <h1>&#11015; Download Manager</h1>
  <button id="logBtn" class="btn-ghost" type="button">Log error</button>
  <button id="galleryBtn" class="btn-ghost" type="button">Galeri</button>
  <button id="newBtn" class="new-btn" type="button">+ New Download</button>
</div>
<div id="deviceStatus"></div>
<div class="tools">
  <button id="pauseAllBtn" type="button">Jeda semua</button>
  <button id="resumeAllBtn" type="button">Lanjut semua</button>
  <button id="retryFailedBtn" type="button">Ulangi gagal</button>
  <button id="clearCompletedBtn" type="button">Bersihkan selesai</button>
</div>
<div id="logBox" class="hidden">
  <pre id="logText"></pre>
  <button id="logClose" type="button" class="btn-ghost">Tutup</button>
</div>
<div id="mediaModal">
  <img id="mmImage" class="hidden">
  <video id="mmVideo" class="hidden" controls autoplay playsinline></video>
  <div class="m-actions">
    <a id="mmDownload" class="dl" href="#" download>Download</a>
    <button id="mmClose" type="button" class="btn-ghost">Tutup</button>
  </div>
</div>
<form id="addForm" class="hidden">
  <input id="url" type="url" placeholder="URL file (https://…)" required>
  <input id="name" type="text" placeholder="Nama file (opsional)">
  <input id="checksum" type="text" placeholder="Checksum opsional (md5:/sha1:/sha256:)">
  <div class="form-row">
    <select id="speed">
      <option value="0">Kecepatan: global</option>
      <option value="128">128 KB/s</option>
      <option value="256">256 KB/s</option>
      <option value="512">512 KB/s</option>
      <option value="1024">1 MB/s</option>
      <option value="2048">2 MB/s</option>
      <option value="5120">5 MB/s</option>
    </select>
    <select id="priority">
      <option value="-1">Prioritas: Rendah</option>
      <option value="0" selected>Prioritas: Normal</option>
      <option value="1">Prioritas: Tinggi</option>
    </select>
  </div>
  <div class="form-row">
    <button type="submit">Tambah Download</button>
    <button id="cancelAdd" type="button" class="btn-ghost">Batal</button>
  </div>
</form>
<div id="galleryView" class="hidden">
  <div id="galleryStatus"></div>
  <div id="galleryGrid" class="gal-grid"></div>
</div>
<div id="status"></div>
<ul id="list"></ul>
<script>
const API = '';
let failCount = 0;

const addForm = document.getElementById('addForm');
const newBtn = document.getElementById('newBtn');

function toggleAddForm(show) {
  addForm.classList.toggle('hidden', !show);
  newBtn.textContent = show ? '\u2715 Tutup' : '+ New Download';
  if (show) document.getElementById('url').focus();
}

newBtn.addEventListener('click', function () {
  toggleAddForm(addForm.classList.contains('hidden'));
});

const logBtn = document.getElementById('logBtn');
const logBox = document.getElementById('logBox');
const logText = document.getElementById('logText');
logBtn.addEventListener('click', async function () {
  try {
    const res = await fetch(API + '/api/log');
    logText.textContent = await res.text();
  } catch (e) {
    logText.textContent = 'Gagal mengambil log: ' + e;
  }
  logBox.classList.remove('hidden');
});
document.getElementById('logClose').addEventListener('click', function () {
  logBox.classList.add('hidden');
});
document.getElementById('cancelAdd').addEventListener('click', function () {
  toggleAddForm(false);
});

async function refreshStatus() {
  try {
    const res = await fetch(API + '/api/status');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const st = await res.json();
    const el = document.getElementById('deviceStatus');
    let text = '';
    if (st.batteryPercent >= 0) {
      text += '\ud83d\udd0b ' + st.batteryPercent + '%';
      text += st.batteryCharging ? ' (mengisi)' : '';
    } else {
      text += '\ud83d\udd0b ?';
    }
    if (typeof st.storageFree === 'number') {
      text += ' \u00b7 \ud83d\udcbe Sisa ' + fmt(st.storageFree);
    }
    text += ' \u00b7 Port ' + st.port;
    el.textContent = text;
  } catch (e) {
    /* server off: biarkan kosong */
  }
}

let galleryOpen = false;
const galleryView = document.getElementById('galleryView');
const galleryBtn = document.getElementById('galleryBtn');
const galleryGrid = document.getElementById('galleryGrid');
const galleryStatus = document.getElementById('galleryStatus');
const mediaModal = document.getElementById('mediaModal');
const mmImage = document.getElementById('mmImage');
const mmVideo = document.getElementById('mmVideo');
const mmDownload = document.getElementById('mmDownload');

galleryBtn.addEventListener('click', function () {
  galleryOpen = !galleryOpen;
  galleryView.classList.toggle('hidden', !galleryOpen);
  galleryBtn.textContent = galleryOpen ? '\u2715 Tutup galeri' : 'Galeri';
  if (galleryOpen) {
    loadGallery();
  } else {
    refresh();
  }
});

document.getElementById('mmClose').addEventListener('click', function () {
  mediaModal.classList.remove('open');
  mmVideo.pause();
  mmVideo.removeAttribute('src');
  mmImage.classList.add('hidden');
  mmVideo.classList.add('hidden');
});

mediaModal.addEventListener('click', function (e) {
  if (e.target === mediaModal) {
    document.getElementById('mmClose').click();
  }
});

async function loadGallery() {
  try {
    const res = await fetch(API + '/api/gallery');
    if (res.status === 401) {
      galleryStatus.textContent = 'PIN diperlukan. Muat ulang halaman untuk login.';
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    galleryStatus.textContent = '';
    const grid = galleryGrid;
    grid.innerHTML = '';
    if (!data.items || !data.items.length) {
      grid.innerHTML = '<div class="gal-empty">Belum ada foto/video di folder download.</div>';
      return;
    }
    for (const it of data.items) {
      const cell = document.createElement('div');
      cell.className = 'gal-cell';
      const src = API + '/api/media?token=' + encodeURIComponent(it.token);
      if (it.isVideo) {
        cell.innerHTML =
          '<div class="gal-play"><span></span></div>' +
          '<div class="gal-name">' + escapeHtml(it.name) + '</div>';
      } else {
        cell.innerHTML =
          '<img loading="lazy" src="' + src + '" alt="' + escapeHtml(it.name) + '">' +
          '<div class="gal-name">' + escapeHtml(it.name) + '</div>';
      }
      cell.addEventListener('click', function () {
        openMedia(it, src);
      });
      grid.appendChild(cell);
    }
  } catch (e) {
    galleryStatus.textContent = 'Gagal memuat galeri: ' + e;
  }
}

function openMedia(it, src) {
  mmImage.classList.add('hidden');
  mmVideo.classList.add('hidden');
  mmImage.removeAttribute('src');
  mmVideo.removeAttribute('src');
  if (it.isVideo) {
    mmVideo.src = src;
    mmVideo.classList.remove('hidden');
  } else {
    mmImage.src = src;
    mmImage.classList.remove('hidden');
  }
  mmDownload.href = src + '&dl=1';
  mmDownload.setAttribute('download', it.name);
  mediaModal.classList.add('open');
}

async function refresh() {
  try {
    const res = await fetch(API + '/api/downloads');
    if (res.status === 401) {
      document.getElementById('status').textContent = 'PIN diperlukan. Muat ulang halaman untuk login.';
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    failCount = 0;
    document.getElementById('status').textContent = '';
    render(data.items);
  } catch (e) {
    failCount++;
    if (failCount > 2) {
      document.getElementById('status').textContent = 'Tidak dapat terhubung ke server. Cek server di aplikasi.';
    }
  }
}

function fmt(bytes) {
  if (bytes < 1024) return bytes + ' B';
  const kb = bytes / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB';
  const mb = kb / 1024;
  if (mb < 1024) return mb.toFixed(1) + ' MB';
  return (mb / 1024).toFixed(2) + ' GB';
}

function fmtSpeed(bps) {
  if (bps < 1024) return bps + ' B/s';
  const kb = bps / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB/s';
  return (kb / 1024).toFixed(2) + ' MB/s';
}

function fmtEta(seconds) {
  if (seconds <= 0) return '0s';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return h + 'h ' + String(m).padStart(2, '0') + 'm';
  if (m > 0) return m + 'm ' + String(s).padStart(2, '0') + 's';
  return s + 's';
}

function stateLabel(s) {
  return {PENDING:'Menunggu', DOWNLOADING:'Mendownload', PAUSED:'Dijeda', COMPLETED:'Selesai', FAILED:'Gagal', CANCELLED:'Dibatalkan'}[s] || s;
}

function render(items) {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<li>Belum ada download.</li>';
    return;
  }
  for (const it of items) {
    const li = document.createElement('li');
    const prog = it.totalBytes > 0 ? Math.round(it.bytesDownloaded * 100 / it.totalBytes) : 0;
    let meta = it.totalBytes > 0
      ? prog + '% &#183; ' + fmt(it.bytesDownloaded) + ' / ' + fmt(it.totalBytes)
      : fmt(it.bytesDownloaded);
    if (it.state === 'DOWNLOADING' && it.speedBps > 0) {
      meta += ' &#183; ' + fmtSpeed(it.speedBps);
      if (it.etaSeconds > 0) meta += ' &#183; ETA ' + fmtEta(it.etaSeconds);
    }
    const err = it.error ? '<div class="err">' + escapeHtml(it.error) + '</div>' : '';
    li.innerHTML =
      '<div class="name">' + escapeHtml(it.fileName) + '</div>' +
      '<div class="state">' + stateLabel(it.state) + ' &#183; ' + meta + err + '</div>' +
      '<div class="bar"><div class="fill" style="width:' + prog + '%"></div></div>' +
      '<div class="actions">' + actionButtons(it) + '</div>';
    li.querySelectorAll('[data-action]').forEach(b =>
      b.addEventListener('click', () => doAction(it.id, b.dataset.action))
    );
    list.appendChild(li);
  }
}

function actionButtons(it) {
  let s = '';
  const encId = encodeURIComponent(it.id);
  if (it.state === 'COMPLETED') {
    s += '<a class="stream" href="' + API + '/file/' + encId + '" target="_blank">Stream</a>';
    s += '<a class="dl" href="' + API + '/file/' + encId + '?dl=1" download>Download</a>';
  }
  if (it.state === 'DOWNLOADING') s += '<button data-action="pause">Jeda</button>';
  if (it.state === 'PAUSED' || it.state === 'FAILED') s += '<button data-action="resume">Lanjut</button>';
  if (it.state === 'DOWNLOADING' || it.state === 'PENDING' || it.state === 'PAUSED') s += '<button data-action="cancel">Batal</button>';
  if (it.state === 'COMPLETED' || it.state === 'FAILED' || it.state === 'CANCELLED') s += '<button data-action="delete">Hapus</button>';
  return s;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function doAction(id, action) {
  const body = new URLSearchParams({id: id, action: action});
  await fetch(API + '/api/action', {method: 'POST', body});
  refresh();
}

function globalAction(action) {
  doAction('', action);
}

document.getElementById('pauseAllBtn').addEventListener('click', function () {
  globalAction('pause_all');
});
document.getElementById('resumeAllBtn').addEventListener('click', function () {
  globalAction('resume_all');
});
document.getElementById('retryFailedBtn').addEventListener('click', function () {
  globalAction('retry_failed');
});
document.getElementById('clearCompletedBtn').addEventListener('click', function () {
  globalAction('clear_completed');
});

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  const body = new URLSearchParams({url: url});
  const name = document.getElementById('name').value.trim();
  if (name) body.append('name', name);
  body.append('speedLimitKbps', document.getElementById('speed').value);
  body.append('priority', document.getElementById('priority').value);
  const checksum = document.getElementById('checksum').value.trim();
  if (checksum) body.append('checksum', checksum);
  await fetch(API + '/api/add', {method: 'POST', body});
  document.getElementById('url').value = '';
  document.getElementById('name').value = '';
  toggleAddForm(false);
  refresh();
});

refresh();
refreshStatus();
setInterval(refresh, 1500);
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
