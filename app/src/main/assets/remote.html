<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Manager Remote</title>
<style>
  :root {
    --bg: #f4f6fb;
    --bg-soft: #eef1f8;
    --card: #ffffff;
    --ink: #17203a;
    --muted: #64718c;
    --primary: #4353e6;
    --primary-2: #3344d0;
    --primary-soft: #eceefd;
    --accent: #f76707;
    --green: #0f9d58;
    --green-bg: #e6f6ee;
    --red: #d93025;
    --red-bg: #fdeceb;
    --amber: #b26a00;
    --amber-bg: #fdf3e0;
    --blue-bg: #e8eefc;
    --line: #e3e8f2;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(23,32,58,.05);
    --shadow: 0 1px 2px rgba(23,32,58,.04), 0 10px 28px rgba(23,32,58,.07);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); margin: 0; padding: 0 0 56px; color: var(--ink); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .topbar { position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); box-shadow: 0 1px 8px rgba(23,32,58,.04); }
  .topbar-in { max-width: 880px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; margin-right: auto; color: var(--ink); }
  .brand .logo { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), #7a5cff); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 3px 8px rgba(67,83,230,.35); }
  .brand small { display: block; font-weight: 500; font-size: 10.5px; opacity: .6; letter-spacing: .3px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s ease; }
  .pill:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .pill.primary { background: linear-gradient(135deg, var(--primary), #5f6ff0); border-color: transparent; color: #fff; box-shadow: 0 3px 10px rgba(67,83,230,.3); }
  .pill.primary:hover { background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: #fff; }
  .wrap { max-width: 880px; margin: 18px auto 0; padding: 0 16px; }
  .status-card { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow-sm); margin-bottom: 16px; font-size: 13px; color: var(--muted); }
  .status-card .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; box-shadow: 0 0 0 3px var(--green-bg); }
  .status-card b { color: var(--ink); font-weight: 700; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .toolbar button { padding: 8px 14px; font-size: 13px; font-weight: 600; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; transition: all .15s ease; }
  .toolbar button:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .toolbar button.busy { opacity: .5; pointer-events: none; }
  .seg { display: flex; gap: 4px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .15s ease; }
  .seg button.on { background: var(--card); color: var(--primary); box-shadow: 0 2px 6px rgba(23,32,58,.10); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 16px; margin-bottom: 16px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select { font-size: 15px; padding: 11px 13px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; transition: border-color .15s ease, box-shadow .15s ease; }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .form-row { display: flex; gap: 10px; }
  .form-row button { flex: 1; padding: 12px; border-radius: var(--radius-sm); border: 0; font-size: 15px; font-weight: 700; cursor: pointer; transition: all .15s ease; }
  .btn-main { background: linear-gradient(135deg, var(--primary), #5f6ff0); color: #fff; box-shadow: 0 3px 10px rgba(67,83,230,.25); }
  .btn-main:hover { background: linear-gradient(135deg, var(--primary-2), var(--primary)); }
  .btn-ghost { background: var(--bg-soft); color: var(--ink); border: 1px solid var(--line) !important; }
  .btn-ghost:hover { background: #e3e8f4; }
  #status { color: var(--red); margin: 4px 0 12px; font-size: 13px; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .b-done { background: var(--green-bg); color: var(--green); }
  .b-active { background: var(--blue-bg); color: var(--primary); }
  .b-paused { background: var(--amber-bg); color: var(--amber); }
  .b-fail { background: var(--red-bg); color: var(--red); }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  li.item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); transition: box-shadow .15s ease; }
  li.item:hover { box-shadow: var(--shadow); }
  .item-top { display: flex; align-items: flex-start; gap: 12px; }
  .icon { flex: 0 0 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--blue-bg); }
  .item-body { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 14.5px; word-break: break-all; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .err { color: var(--red); margin-top: 6px; font-size: 12.5px; word-break: break-word; }
  .bar { height: 7px; background: #e9edf5; border-radius: 999px; overflow: hidden; margin: 10px 0 12px; }
  .fill { height: 100%; background: linear-gradient(90deg, #ffa94d, var(--accent)); width: 0; border-radius: 999px; transition: width .5s ease; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions a, .actions button { padding: 7px 14px; font-size: 12.5px; font-weight: 600; text-decoration: none; border-radius: 999px; border: 1px solid transparent; cursor: pointer; transition: all .15s ease; }
  a.stream { background: var(--green-bg); color: var(--green); }
  a.stream:hover { border-color: var(--green); }
  a.dl { background: var(--amber-bg); color: var(--amber); }
  a.dl:hover { border-color: var(--amber); }
  .actions button { background: var(--bg-soft); color: var(--ink); }
  .actions button:hover { border-color: var(--muted); }
  .actions button.danger { color: var(--red); }
  .actions button.danger:hover { background: var(--red-bg); border-color: var(--red); }
  .spark { width: 100%; height: 26px; display: block; margin-top: 8px; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.6; }
  #logBox pre { background: #10172a; color: #c9d8ff; border-radius: var(--radius-sm); padding: 12px; font-size: 12px; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  #logBox .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 700; }
  .gal-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .gal-toolbar h2 { margin: 0; font-size: 16px; }
  .gal-toolbar .count { font-size: 12px; color: var(--muted); }
  .gal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .gal-cell { position: relative; aspect-ratio: 4 / 3; background: #1c2230; border-radius: 14px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform .15s ease, box-shadow .15s ease; }
  .gal-cell:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .gal-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gal-cell .gal-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.18); }
  .gal-cell .gal-play span { width: 0; height: 0; border-top: 16px solid transparent; border-bottom: 16px solid transparent; border-left: 26px solid rgba(255,255,255,.95); filter: drop-shadow(0 1px 4px rgba(0,0,0,.6)); }
  .gal-cell .del { position: absolute; top: 6px; right: 6px; z-index: 3; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 14px; cursor: pointer; line-height: 1; }
  .gal-cell .del:hover { background: var(--red); }
  .gal-cell .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 10px 8px; font-size: 11px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.8)); }
  .cap .n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap .m { opacity: .8; margin-top: 2px; }
  .gal-cell .ext { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9aa4b2; font-size: 26px; font-weight: 800; text-transform: uppercase; }
  .gal-empty { grid-column: 1 / -1; padding: 44px 16px; text-align: center; color: var(--muted); }
  #galleryStatus { color: var(--red); font-size: 13px; margin-bottom: 8px; }
  .fs-path { font-size: 12.5px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 13px; margin-bottom: 12px; word-break: break-all; }
  .fs-list { display: flex; flex-direction: column; gap: 8px; }
  .fs-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow-sm); transition: border-color .15s ease; }
  .fs-row.fs-dir { cursor: pointer; }
  .fs-row.fs-dir:hover { border-color: var(--primary); }
  .fs-row .icon { flex: 0 0 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 19px; background: var(--blue-bg); }
  .fs-row .fs-main { flex: 1 1 140px; min-width: 0; }
  .fs-row .fs-name { font-weight: 700; font-size: 13.5px; word-break: break-all; }
  .fs-row .fs-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .fs-row .fs-actions { flex: 1 1 100%; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .fs-row .fs-actions a, .fs-row .fs-actions button { padding: 6px 12px; font-size: 12px; font-weight: 600; text-decoration: none; border-radius: 999px; border: 1px solid transparent; cursor: pointer; transition: all .15s ease; }
  .fs-actions a, .fs-actions button { background: var(--bg-soft); color: var(--ink); }
  .fs-actions a.fs-stream { background: var(--green-bg); color: var(--green); }
  .fs-actions a.fs-stream:hover { border-color: var(--green); }
  .fs-actions a.fs-dl { background: var(--amber-bg); color: var(--amber); }
  .fs-actions a.fs-dl:hover { border-color: var(--amber); }
  .fs-actions button:hover { border-color: var(--muted); }
  .fs-actions button.danger { color: var(--red); }
  .fs-actions button.danger:hover { background: var(--red-bg); border-color: var(--red); }
  .fs-root { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; margin-bottom: 10px; box-shadow: var(--shadow-sm); transition: border-color .15s ease; }
  .fs-root:hover { border-color: var(--primary); }
  .fs-root .fs-rcap small { display: block; color: var(--muted); font-size: 12px; word-break: break-all; margin-top: 2px; }
  .fs-empty { padding: 36px 16px; text-align: center; color: var(--muted); }
  .btn-ghost:disabled { opacity: .45; cursor: default; }
  .fs-tools { display: flex; gap: 8px; margin-bottom: 12px; }
  .fs-tools input { flex: 1; }
  .fs-tools select { flex: 0 0 auto; width: auto; }
  .fs-upload { margin: 0 0 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: var(--shadow-sm); }
  .fs-upload-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .fs-upload-head span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fs-upload .bar { height: 6px; border-radius: 999px; background: var(--primary-soft); overflow: hidden; }
  .fs-upload .fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--primary), #7a5cff); transition: width .2s ease; }
  .fs-batch { display: flex; align-items: center; gap: 8px; background: var(--primary-soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
  .fs-batch span { font-size: 13px; font-weight: 700; margin-right: auto; }
  .fs-batch button { padding: 7px 13px; font-size: 12.5px; font-weight: 600; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .fs-batch button:hover { border-color: var(--primary); }
  .fs-batch button.danger { color: var(--red); }
  .fs-check { flex: 0 0 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; line-height: 1; }
  .fs-check.on { background: var(--primary); border-color: var(--primary); }
  html[data-theme="dark"] {
    --bg: #0e1117;
    --bg-soft: #171c26;
    --card: #1a202b;
    --ink: #e6ebf4;
    --muted: #93a1b5;
    --primary: #6d7dff;
    --primary-2: #5564f0;
    --primary-soft: #232b45;
    --accent: #ff8f2b;
    --green: #3fbf77;
    --green-bg: #123524;
    --red: #ff7a7a;
    --red-bg: #3a1717;
    --amber: #f5a623;
    --amber-bg: #3a2c0e;
    --blue-bg: #1d2c4d;
    --line: #262e3c;
  }
  html[data-theme="dark"] .topbar { background: rgba(14,17,23,.85); border-bottom-color: #232b38; }
  html[data-theme="dark"] .seg { background: #141924; }
  html[data-theme="dark"] .seg button.on { background: #232c3c; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  html[data-theme="dark"] input, html[data-theme="dark"] select { background: #141924; color: var(--ink); border-color: var(--line); }
  html[data-theme="dark"] input:focus, html[data-theme="dark"] select:focus { box-shadow: 0 0 0 3px var(--primary-soft); }
  html[data-theme="dark"] .bar { background: #232b38; }
  html[data-theme="dark"] .gal-cell { background: #0e1116; }
  html[data-theme="dark"] .fs-actions a, html[data-theme="dark"] .fs-actions button,
  html[data-theme="dark"] .actions button, html[data-theme="dark"] .btn-ghost { background: #232b38; color: var(--ink); }
  html[data-theme="dark"] .actions a.stream, html[data-theme="dark"] a.fs-stream { background: var(--green-bg); color: var(--green); }
  html[data-theme="dark"] .actions a.dl, html[data-theme="dark"] a.fs-dl { background: var(--amber-bg); color: var(--amber); }
  html[data-theme="dark"] #logBox pre { background: #0b0f16; }
  #mediaModal { position: fixed; inset: 0; background: rgba(8,10,16,.94); z-index: 60; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
  #mediaModal.open { display: flex; }
  #mediaModal img, #mediaModal video { max-width: 100%; max-height: 76vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #mmTitle { color: #fff; font-size: 14px; font-weight: 600; margin: 12px 0 4px; max-width: 90vw; text-align: center; word-break: break-all; }
  #mmSub { color: rgba(255,255,255,.65); font-size: 12px; margin-bottom: 12px; }
  .m-actions { display: flex; gap: 10px; }
  .m-actions a, .m-actions button { padding: 9px 18px; border-radius: 999px; border: 0; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; }
  .m-actions button.danger { background: #c62828; color: #fff; }
  .hidden { display: none !important; }
  @media (max-width: 600px) {
    .wrap { padding: 0 12px; margin-top: 12px; }
    .topbar-in { padding: 10px 12px; gap: 6px; }
    .brand { font-size: 15px; }
    .brand small { display: none; }
    .brand .logo { width: 30px; height: 30px; font-size: 15px; }
    .pill { padding: 7px 11px; font-size: 12px; }
    .toolbar button { flex: 1 1 44%; }
    .seg { width: 100%; }
    .seg button { flex: 1; padding: 7px 6px; font-size: 12.5px; }
    .card { padding: 14px; }
    input, select { font-size: 16px; padding: 12px; }
    .gal-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .gal-cell { aspect-ratio: 4 / 3; }
    .fs-row { padding: 12px; }
    .fs-row .fs-actions a, .fs-row .fs-actions button { flex: 1 1 auto; min-width: 64px; padding: 8px 10px; text-align: center; }
    .fs-path { font-size: 12px; }
    .fs-tools { flex-direction: column; }
    .fs-tools select { width: 100%; }
    .fs-batch { flex-wrap: wrap; }
    .fs-batch button { flex: 1 1 auto; }
    .item { padding: 14px; }
    .name { font-size: 13.5px; }
    .icon { flex-basis: 36px; height: 36px; font-size: 18px; }
    .actions a, .actions button { padding: 7px 11px; font-size: 12px; }
    .grid2 { grid-template-columns: 1fr; }
    .status-card { font-size: 12px; padding: 10px 14px; }
    #mediaModal { padding: 12px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="logo">&#11015;</span><span>Download Manager<small>Remote Control</small></span></div>
    <button id="newBtn" class="pill primary" type="button">+ New Download</button>
    <button id="galleryBtn" class="pill" type="button">&#128247; Galeri</button>
    <button id="fsBtn" class="pill" type="button">&#128193; File Manager</button>
    <button id="logBtn" class="pill" type="button">&#128241; Log error</button>
    <button id="themeBtn" class="pill" type="button">&#127769;</button>
  </div>
</div>

<div class="wrap">
  <div class="status-card" id="deviceStatus">
    <span><span class="dot"></span>Menghubungkan ke device…</span>
  </div>

  <div class="toolbar">
    <button id="pauseAllBtn" type="button">&#9209; Jeda semua</button>
    <button id="resumeAllBtn" type="button">&#9654; Lanjut semua</button>
    <button id="retryFailedBtn" type="button">&#8635; Ulangi gagal</button>
    <button id="clearCompletedBtn" type="button">&#128465; Bersihkan selesai</button>
  </div>

  <div class="seg" id="filters">
    <button id="webFilterAll" type="button" class="on">Semua</button>
    <button id="webFilterActive" type="button">Aktif</button>
    <button id="webFilterCompleted" type="button">Selesai</button>
    <button id="webFilterFailed" type="button">Gagal</button>
  </div>

  <div id="logBox" class="card hidden">
    <div class="row"><span>Log error device</span><button id="logClose" type="button" class="btn-ghost">Tutup</button></div>
    <pre id="logText"></pre>
  </div>

  <form id="addForm" class="card hidden">
    <input id="url" type="url" placeholder="URL file (https://…)" required>
    <input id="name" type="text" placeholder="Nama file (opsional)">
    <input id="checksum" type="text" placeholder="Checksum opsional (md5:/sha1:/sha256:)">
    <div class="grid2">
      <select id="speed">
        <option value="0">Kecepatan: global</option>
        <option value="128">128 KB/s</option>
        <option value="256">256 KB/s</option>
        <option value="512">512 KB/s</option>
        <option value="1024">1 MB/s</option>
        <option value="2048">2 MB/s</option>
        <option value="5120">5 MB/s</option>
      </select>
      <select id="priority">
        <option value="-1">Prioritas: Rendah</option>
        <option value="0" selected>Prioritas: Normal</option>
        <option value="1">Prioritas: Tinggi</option>
      </select>
    </div>
    <input id="storage" type="text" placeholder="Path folder tujuan di device (kosongkan = default)" value="">
    <div class="form-row">
      <button type="submit" class="btn-main">Tambah Download</button>
      <button id="cancelAdd" type="button" class="btn-ghost">Batal</button>
    </div>
  </form>

  <div id="galleryView" class="hidden">
    <div class="gal-toolbar"><h2>&#128247; Galeri Device</h2><span class="count" id="galleryCount"></span></div>
    <div id="galleryStatus"></div>
    <div id="galleryGrid" class="gal-grid"></div>
  </div>

  <div id="fsView" class="hidden">
    <div class="gal-toolbar">
      <h2>&#128193; File Manager</h2>
      <span class="count" id="fsCount"></span>
      <button id="fsUpBtn" type="button" class="btn-ghost" style="margin-left:auto">&#11014; Naik</button>
    </div>
    <div id="fsPath" class="fs-path"></div>
    <div class="toolbar">
      <button id="fsMkdirBtn" type="button">&#128193; Folder baru</button>
      <button id="fsUploadBtn" type="button">&#11014; Upload</button>
      <button id="fsSelectBtn" type="button">&#9989; Pilih</button>
    </div>

<script>
const API = '';
const themeBtn = document.getElementById('themeBtn');

  themeBtn.textContent = theme === 'dark' ? '\u2600\uFE0F' : '\u{1F319}';
}
applyTheme(localStorage.getItem('dm_theme') || 'light');
themeBtn.addEventListener('click', function () {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

let failCount = 0;
let webFilter = 'ALL';
const WEB_FILTERS = {ALL:'webFilterAll', ACTIVE:'webFilterActive', COMPLETED:'webFilterCompleted', FAILED:'webFilterFailed'};
Object.entries(WEB_FILTERS).forEach(function (e) {
  document.getElementById(e[1]).addEventListener('click', function () {
    webFilter = e[0];
    Object.entries(WEB_FILTERS).forEach(function (f) {
      document.getElementById(f[1]).classList.toggle('on', f[0] === webFilter);
    });

const addForm = document.getElementById('addForm');
const newBtn = document.getElementById('newBtn');
function toggleAddForm(show) {
  addForm.classList.toggle('hidden', !show);
  newBtn.textContent = show ? '\u2715 Tutup' : '+ New Download';
  if (show) document.getElementById('url').focus();
}
newBtn.addEventListener('click', function () {
  toggleAddForm(addForm.classList.contains('hidden'));
});

const logBtn = document.getElementById('logBtn');
const logBox = document.getElementById('logBox');
const logText = document.getElementById('logText');
logBtn.addEventListener('click', async function () {
  try {
    const res = await fetch(API + '/api/log');
    logText.textContent = await res.text();
  } catch (e) {
    logText.textContent = 'Gagal mengambil log: ' + e;
  }

document.getElementById('logClose').addEventListener('click', function () {
  logBox.classList.add('hidden');
});
document.getElementById('cancelAdd').addEventListener('click', function () {

});

async function refreshStatus() {
  try {
    const res = await fetch(API + '/api/status');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const st = await res.json();
    const el = document.getElementById('deviceStatus');
    let text = '<span><span class="dot"></span><b>Device terhubung</b></span>';
    if (st.batteryPercent >= 0) {
      text += '<span>&#128267; Baterai <b>' + st.batteryPercent + '%</b>' + (st.batteryCharging ? ' (mengisi)' : '') + '</span>';
    } else {
      text += '<span>&#128267; Baterai ?</span>';
    }
    if (typeof st.storageFree === 'number') {
      text += '<span>&#128190; Sisa <b>' + fmt(st.storageFree) + '</b></span>';
    }
    text += '<span>&#128424; Port <b>' + st.port + '</b></span>';
    el.innerHTML = text;
  } catch (e) {
    document.getElementById('deviceStatus').innerHTML = '<span><span class="dot"></span><b>Server tidak terhubung</b> — mulai server dari aplikasi</span>';
  }
}

let galleryOpen = false;
const galleryView = document.getElementById('galleryView');
const galleryBtn = document.getElementById('galleryBtn');
const galleryGrid = document.getElementById('galleryGrid');
const galleryCount = document.getElementById('galleryCount');
const galleryStatus = document.getElementById('galleryStatus');
const mediaModal = document.getElementById('mediaModal');
const mmImage = document.getElementById('mmImage');
const mmVideo = document.getElementById('mmVideo');
const mmTitle = document.getElementById('mmTitle');
const mmSub = document.getElementById('mmSub');
const mmClose = document.getElementById('mmClose');

galleryBtn.addEventListener('click', function () {
  if (fsOpen) {
    fsOpen = false;
    fsView.classList.add('hidden');
    fsBtn.textContent = '\u{1F4C1} File Manager';
  }
  galleryOpen = !galleryOpen;
  galleryView.classList.toggle('hidden', !galleryOpen);
  galleryBtn.textContent = galleryOpen ? '\u2715 Tutup galeri' : '\u{1F4F7} Galeri';
  if (galleryOpen) {
    loadGallery();
  } else {
    refresh();
  }
});

document.getElementById('mmClose').addEventListener('click', function () {
  mediaModal.classList.remove('open');
  mmVideo.pause();
  mmVideo.removeAttribute('src');
  mmImage.classList.add('hidden');
  mmVideo.classList.add('hidden');
});

mediaModal.addEventListener('click', function (e) {
  if (e.target === mediaModal) {
    document.getElementById('mmClose').click();
  }
});

async function loadGallery() {
  try {
    const res = await fetch(API + '/api/gallery');
    if (res.status === 401) {
      galleryStatus.textContent = 'PIN diperlukan. Muat ulang halaman untuk login.';
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    galleryStatus.textContent = '';
    const grid = galleryGrid;
    grid.innerHTML = '';
    galleryCount.textContent = data.items && data.items.length ? data.items.length + ' file' : '';
    if (!data.items || !data.items.length) {
      grid.innerHTML = '<div class="gal-empty">Belum ada foto/video di folder download.</div>';
      return;
    }
    for (const it of data.items) {
      const cell = document.createElement('div');
      cell.className = 'gal-cell';
      const thumb = API + '/api/thumb?token=' + encodeURIComponent(it.token);
      const media = API + '/api/media?token=' + encodeURIComponent(it.token);
      cell.innerHTML =
        '<button class="del" title="Hapus" type="button">&#128465;</button>' +
        '<div class="ext">' + escapeHtml(extOf(it.name)) + '</div>' +
        '<img loading="lazy" src="' + thumb + '" alt="' + escapeHtml(it.name) + '" onerror="this.remove()">' +
        (it.isVideo ? '<div class="gal-play"><span></span></div>' : '') +
        '<div class="cap"><div class="n">' + escapeHtml(it.name) + '</div>' +
        '<div class="m">' + fmt(it.size) + (it.modified > 0 ? ' \u00b7 ' + fmtDate(it.modified) : '') + '</div></div>';
      cell.addEventListener('click', function () {
        openMedia(it, media, thumb);
      });
      cell.querySelector('.del').addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (!confirm('Hapus file ini?\n' + it.name)) return;
        doDeleteMedia(it.token, function () {
          cell.remove();
          const c = parseInt(galleryCount.textContent, 10);
          if (!isNaN(c)) galleryCount.textContent = Math.max(0, c - 1) + ' file';
        });
      });
      grid.appendChild(cell);
    }
  } catch (e) {
    galleryStatus.textContent = 'Gagal memuat galeri: ' + e;
  }
}

// File manager
let fsOpen = false;
let fsPath = '';
let fsItems = [];
let fsSelectMode = false;
const fsSelected = [];
const fsView = document.getElementById('fsView');
const fsBtn = document.getElementById('fsBtn');
const fsList = document.getElementById('fsList');
const fsPathEl = document.getElementById('fsPath');
const fsCount = document.getElementById('fsCount');
const fsStatus = document.getElementById('fsStatus');
const fsUpBtn = document.getElementById('fsUpBtn');
const fsSelectBtn = document.getElementById('fsSelectBtn');
const fsBatch = document.getElementById('fsBatch');
const fsToolsRow = document.getElementById('fsToolsRow');
const fsSearch = document.getElementById('fsSearch');
const fsSort = document.getElementById('fsSort');
const fsUploadFile = document.getElementById('fsUploadFile');

fsBtn.addEventListener('click', function () {
  if (galleryOpen) {
    galleryOpen = false;
    galleryView.classList.add('hidden');
    galleryBtn.textContent = '\u{1F4F7} Galeri';
  }
  fsOpen = !fsOpen;
  fsView.classList.toggle('hidden', !fsOpen);
  fsBtn.textContent = fsOpen ? '\u2715 Tutup file' : '\u{1F4C1} File Manager';
  if (!fsOpen) {
    fsSelectMode = false;
    fsSelected.length = 0;
    fsSelectBtn.textContent = '\u9989 Pilih';
    fsBatch.classList.add('hidden');
  }
  if (fsOpen) {
    loadFs();
  } else {
    refresh();
  }
});

fsUpBtn.addEventListener('click', function () {
  fsPath = parentFsPath(fsPath);
  loadFs();
});

function parentFsPath(p) {
  if (!p) return '';
  if (p.startsWith('m:')) {
    const rel = p.slice(2);
    const idx = rel.lastIndexOf('/');
    if (idx <= 0) return 'm:Download';
    return 'm:' + rel.slice(0, idx);
  }
  const idx = p.lastIndexOf('/');
  const up = idx > 0 ? p.slice(0, idx) : '';
  return (up === 'f:' || up === 'm:') ? '' : up;
}

function fsMsg(text, isErr) {
  fsStatus.textContent = text || '';
  fsStatus.style.color = isErr ? 'var(--red)' : 'var(--green)';
}

async function loadFs() {
  try {
    const res = await fetch(API + '/api/fs?path=' + encodeURIComponent(fsPath));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    fsStatus.textContent = '';
    fsPathEl.textContent = fsPath || 'Pilih lokasi penyimpanan';
    fsUpBtn.disabled = !fsPath;
    fsToolsRow.classList.toggle('hidden', !fsPath);
    fsSelectBtn.classList.toggle('hidden', !fsPath);
    fsItems = data.items || [];
    fsCount.textContent = fsItems.length ? fsItems.length + ' item' : '';
    applyFsFilter();
  } catch (e) {
    fsMsg('Gagal memuat: ' + e, true);
  }
}

function applyFsFilter() {
  if (!fsPath) {
    renderFs(fsItems);
    return;
  }
  const q = fsSearch.value.trim().toLowerCase();
  const sort = fsSort.value;
  let items = fsItems;
  if (q) {
    items = items.filter(function (it) {
      return it.name.toLowerCase().indexOf(q) >= 0;
    });
  }
  items = items.slice().sort(function (a, b) {
    if (a.kind !== b.kind) return a.kind === 'dir' ? -1 : 1;
    switch (sort) {
      case 'name_asc': return a.name.localeCompare(b.name);
      case 'name_desc': return b.name.localeCompare(a.name);
      case 'size_desc': return b.size - a.size;
      case 'size_asc': return a.size - b.size;
      case 'date_desc': return b.modified - a.modified;
      case 'date_asc': return a.modified - b.modified;
    }
    return 0;
  });
  renderFs(items);
}

fsSearch.addEventListener('input', applyFsFilter);
fsSort.addEventListener('change', applyFsFilter);

function renderFs(items) {
  const box = fsList;
  box.innerHTML = '';
  if (!fsPath) {
    if (!items.length) {
      box.innerHTML = '<div class="fs-empty">Tidak ada penyimpanan yang tersedia.</div>';
      return;
    }
    for (const r of items) {
      const row = document.createElement('div');
      row.className = 'fs-root';
      row.innerHTML = '<div class="icon">&#128193;</div>' +
        '<div class="fs-main"><div class="fs-name">' + escapeHtml(r.name) + '</div>' +
        '<div class="fs-rcap"><small>' + escapeHtml(r.path) + '</small></div></div>';
      row.addEventListener('click', function () {
        fsPath = r.path;
        loadFs();
      });
      box.appendChild(row);
    }
    return;
  }
  if (!items.length) {
    box.innerHTML = '<div class="fs-empty">Folder kosong.</div>';
    return;
  }
  const mediaExts = ['jpg','jpeg','png','gif','webp','bmp','mp4','mkv','webm','avi','mov','3gp','m4v','mpg','mpeg','mp3','m4a','aac','wav','ogg','flac'];
  for (const it of items) {
    const row = document.createElement('div');
    row.className = 'fs-row';
    if (it.kind === 'dir') row.classList.add('fs-dir');
    const icon = it.kind === 'dir' ? '\u{1F4C1}' : fileIcon(it.name);
    let meta = '';
    if (it.kind === 'file') {
      meta = fmt(it.size);
      if (it.modified > 0) meta += ' \u00b7 ' + fmtDate(it.modified);
    }
    const selIdx = fsSelected.indexOf(it);
    const check = fsSelectMode
      ? '<span class="fs-check' + (selIdx >= 0 ? ' on' : '') + '">' + (selIdx >= 0 ? '\u2713' : '') + '</span>'
      : '';
    let actions = '';
    if (!fsSelectMode) {
      if (it.kind === 'file') {
        const media = API + '/api/media?token=' + encodeURIComponent(it.token);
        if (mediaExts.indexOf(extOf(it.name).toLowerCase()) >= 0) {
          actions += '<a class="fs-stream" href="' + media + '" target="_blank">&#9654; Stream</a>';
        }
        actions += '<a class="fs-dl" href="' + media + '?dl=1" download>&#11015; Download</a>';
      } else {
        actions += '<a class="fs-dl" href="' + API + '/api/fs_zip?path=' +
          encodeURIComponent(it.path) + '" download title="Download folder sebagai ZIP">&#128230; ZIP</a>';
      }
      actions += '<button data-op="rename">&#9998; Rename</button>';
      actions += '<button data-op="move">&#10145; Pindah</button>';
      actions += '<button data-op="delete" class="danger">&#128465; Hapus</button>';
    }
    row.innerHTML =
      check + '<div class="icon">' + icon + '</div>' +
      '<div class="fs-main"><div class="fs-name">' + escapeHtml(it.name) + '</div>' +
      (meta ? '<div class="fs-meta">' + meta + '</div>' : '') + '</div>' +
      (actions ? '<div class="fs-actions">' + actions + '</div>' : '');
    row.addEventListener('click', function () {
      if (fsSelectMode) {
        toggleFsSelect(it, row);
      } else if (it.kind === 'dir') {
        fsPath = it.path;
        loadFs();
      }
    });
    row.querySelectorAll('[data-op]').forEach(function (b) {
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        doFsOp(it, b.dataset.op);
      });
    });
    box.appendChild(row);
  }
}

function toggleFsSelect(it, row) {
  const idx = fsSelected.indexOf(it);
  if (idx >= 0) {
    fsSelected.splice(idx, 1);
  } else {
    fsSelected.push(it);
  }
  const check = row.querySelector('.fs-check');
  check.classList.toggle('on', fsSelected.indexOf(it) >= 0);
  check.textContent = fsSelected.indexOf(it) >= 0 ? '\u2713' : '';
  updateFsBatch();
}

function updateFsBatch() {
  fsBatch.classList.toggle('hidden', fsSelected.length === 0);
  document.getElementById('fsBatchCount').textContent = fsSelected.length + ' dipilih';
}

fsSelectBtn.addEventListener('click', function () {
  if (!fsPath) return;
  fsSelectMode = !fsSelectMode;
  fsSelected.length = 0;
  fsSelectBtn.textContent = fsSelectMode ? '\u2715 Batal pilih' : '\u9989 Pilih';
  fsBatch.classList.add('hidden');
  loadFs();
});

document.getElementById('fsBatchDelete').addEventListener('click', async function () {
  if (!fsSelected.length) return;
  if (!confirm('Hapus ' + fsSelected.length + ' item? Folder dihapus beserta isinya.')) return;
  for (const it of fsSelected) {
    await postFsAction({action: 'delete', path: it.path});
  }
  fsSelected.length = 0;
  loadFs();
});

document.getElementById('fsBatchMove').addEventListener('click', async function () {
  if (!fsSelected.length) return;
  const dest = prompt('Path folder tujuan di device\nContoh: f:/storage/emulated/0/Download/sub\natau: m:Download/sub', fsPath);
  if (!dest) return;
  for (const it of fsSelected) {
    await postFsAction({action: 'move', path: it.path, dest: dest.trim()});
  }
  fsSelected.length = 0;
  loadFs();
});

document.getElementById('fsBatchCancel').addEventListener('click', function () {
  fsSelectMode = false;
  fsSelected.length = 0;
  fsSelectBtn.textContent = '\u9989 Pilih';
  fsBatch.classList.add('hidden');
  loadFs();
});

async function doFsOp(it, op) {
  if (op === 'delete') {
    if (!confirm('Hapus ' + (it.kind === 'dir' ? 'folder' : 'file') + ' ini?\n' + it.name)) return;
    await postFsAction({action: 'delete', path: it.path});
  } else if (op === 'rename') {
    const name = prompt('Nama baru:', it.name);
    if (!name) return;
    await postFsAction({action: 'rename', path: it.path, name: name.trim()});
  } else if (op === 'move') {
    const dest = prompt('Path folder tujuan di device\nContoh: f:/storage/emulated/0/Download/sub\natau: m:Download/sub', fsPath);
    if (!dest) return;
    await postFsAction({action: 'move', path: it.path, dest: dest.trim()});
  }
  loadFs();
}

async function postFsAction(params) {
  const body = new URLSearchParams();
  Object.entries(params).forEach(function (e) { body.append(e[0], e[1]); });
  const res = await fetch(API + '/api/fs_action', {method: 'POST', body});
  const data = await res.json();
  if (!data.ok) fsMsg('Operasi gagal', true);
}

document.getElementById('fsMkdirBtn').addEventListener('click', async function () {
  if (!fsPath) {
    fsMsg('Buka folder tujuan dulu', true);
    return;
  }
  if (fsPath.startsWith('m:')) {
    fsMsg('MediaStore: folder tidak bisa dibuat manual', true);
    return;
  }
  const name = prompt('Nama folder baru:', 'Folder Baru');
  if (!name) return;
  await postFsAction({action: 'mkdir', path: fsPath, name: name.trim()});
  loadFs();
});

function uploadFiles(files, path, statusEl, progressBox, progressText, progressPct, progressBar, done) {
  const total = files.length;
  if (!total) return;
  const failed = [];
  let idx = 0;
  let sentBytes = 0;
  let totalBytes = 0;
  for (const f of files) totalBytes += f.size;
  let lastBytes = 0;
  let lastTime = Date.now();
  let speed = 0;
  progressBox.classList.remove('hidden');

  function uploadOne(file, attempt) {
    statusEl.textContent = 'Mengunggah ' + file.name + ' (' + (idx + 1) + '/' + total + ')' +
      (attempt > 1 ? ' \u00b7 coba ke-' + attempt : '') + ' \u2026';
    progressText.textContent = file.name + (attempt > 1 ? ' (coba ' + attempt + ')' : '');
    const xhr = new XMLHttpRequest();
    xhr.open('POST', API + '/api/upload?name=' + encodeURIComponent(file.name) +
      '&path=' + encodeURIComponent(path));
    xhr.upload.onprogress = function (e) {
      if (!e.lengthComputable) return;
      const now = Date.now();
      const dt = (now - lastTime) / 1000;
      if (dt > 0.3) {
        speed = (e.loaded - lastBytes) / dt;
        lastBytes = e.loaded;
        lastTime = now;
      }
      const doneNow = sentBytes + e.loaded;
      const pct = totalBytes > 0 ? Math.round(doneNow * 100 / totalBytes) : 0;
      progressBar.style.width = pct + '%';
      progressPct.textContent = pct + '% \u00b7 ' + fmtSpeed(speed);
    };
    xhr.onload = function () {
      let ok = false;
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          ok = xhr.responseText && JSON.parse(xhr.responseText).ok;
        } catch (e) {}
      }
      if (ok) {
        sentBytes += file.size;
        finishOne();
      } else {
        retryOrFail(file, attempt);
      }
    };
    xhr.onerror = function () { retryOrFail(file, attempt); };
    xhr.onabort = function () { retryOrFail(file, attempt); };
    xhr.send(file);
  }

  function retryOrFail(file, attempt) {
    if (attempt < 3) {
      setTimeout(function () { uploadOne(file, attempt + 1); }, 600);
      return;
    }
    failed.push(file.name);
    statusEl.textContent = 'Gagal: ' + file.name;
    finishOne();
  }

  function finishOne() {
    idx++;
    if (idx >= total) {
      progressBox.classList.add('hidden');
      if (done) done(failed.length === 0, failed);
      return;
    }
    uploadOne(files[idx], 1);
  }

  uploadOne(files[0], 1);
}

document.getElementById('fsUploadBtn').addEventListener('click', function () {
  if (!fsPath) {
    fsMsg('Buka folder tujuan dulu', true);
    return;
  }
  fsUploadFile.value = '';
  fsUploadFile.click();
});

fsUploadFile.addEventListener('change', function () {
  const files = Array.from(fsUploadFile.files);
  if (!files.length) return;
  const btn = document.getElementById('fsUploadBtn');
  btn.disabled = true;
  uploadFiles(
    files,
    fsPath,
    fsStatus,
    document.getElementById('fsProgressBox'),
    document.getElementById('fsProgressText'),
    document.getElementById('fsProgressPct'),
    document.getElementById('fsProgressBar'),
    function (ok, failed) {
      btn.disabled = false;
      fsUploadFile.value = '';
      if (ok) {
        fsMsg('Selesai: ' + files.length + ' file diunggah');
      } else {
        fsMsg(files.length - failed.length + ' berhasil, ' + failed.length + ' gagal: ' + failed.join(', '), true);
      }
      loadFs();
    }
  );
});

function extOf(name) {
  const i = name.lastIndexOf('.');
  return i >= 0 ? name.slice(i + 1).slice(0, 6) : '\u2699';
}

function fmtDate(ms) {
  const d = new Date(ms);
  return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()] + ' ' + d.getFullYear();
}

async function doDeleteMedia(token, ok) {
  const body = new URLSearchParams({token: token});
  try {
    const res = await fetch(API + '/api/delete_media', {method: 'POST', body});
    const data = await res.json();
    if (data.ok) {
      if (ok) ok();
    } else {
      alert('Gagal menghapus: ' + (data.error || '?'));
    }
  } catch (e) {
    alert('Gagal menghapus: ' + e);
  }
}

function openMedia(it, src, thumb) {
  mmImage.classList.add('hidden');
  mmVideo.classList.add('hidden');
  mmImage.removeAttribute('src');
  mmVideo.removeAttribute('src');
  mmTitle.textContent = it.name;
  mmSub.textContent = fmt(it.size) + (it.modified > 0 ? ' \u00b7 ' + fmtDate(it.modified) : '') + (it.isVideo ? ' \u00b7 video' : ' \u00b7 foto');
  if (it.isVideo) {
    mmVideo.src = src;
    mmVideo.classList.remove('hidden');
  } else {
    mmImage.src = src;
    mmImage.classList.remove('hidden');
  }
  mmClose.classList.toggle('hidden', it.isVideo);
  mediaModal.classList.add('open');
}

async function refresh() {
  try {
    const res = await fetch(API + '/api/downloads');
    if (res.status === 401) {
      document.getElementById('status').textContent = 'PIN diperlukan. Muat ulang halaman untuk login.';
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    failCount = 0;
    document.getElementById('status').textContent = '';
    (data.items || []).forEach(sampleSpeed);
    render(data.items);
  } catch (e) {
    failCount++;
    if (failCount > 2) {
      document.getElementById('status').textContent = 'Tidak dapat terhubung ke server. Cek server di aplikasi.';
    }
  }
}

function fmt(bytes) {
  if (bytes < 1024) return bytes + ' B';
  const kb = bytes / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB';
  const mb = kb / 1024;
  if (mb < 1024) return mb.toFixed(1) + ' MB';
  return (mb / 1024).toFixed(2) + ' GB';
}

function fmtSpeed(bps) {
  if (bps < 1024) return bps + ' B/s';
  const kb = bps / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB/s';
  return (kb / 1024).toFixed(2) + ' MB/s';
}

const speedHistory = {};
function sampleSpeed(it) {
  if (it.state !== 'DOWNLOADING') {
    delete speedHistory[it.id];
    return;
  }
  const arr = speedHistory[it.id] || [];
  arr.push(it.speedBps);
  if (arr.length > 30) arr.shift();
  speedHistory[it.id] = arr;
}

function sparkSvg(arr) {
  if (!arr || arr.length < 2) return '';
  const w = 120;
  const h = 26;
  const max = Math.max.apply(null, arr) || 1;
  const pts = arr.map(function (v, i) {
    const x = Math.round((i / (arr.length - 1)) * (w - 4)) + 2;
    const y = h - 3 - Math.round((v / max) * (h - 6));
    return x + ',' + y;
  }).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    '<polyline points="' + pts + '"/></svg>';
}

function fmtEta(seconds) {
  if (seconds <= 0) return '0s';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return h + 'j ' + String(m).padStart(2, '0') + 'm';
  if (m > 0) return m + 'm ' + String(s).padStart(2, '0') + 's';
  return s + 's';
}

function stateLabel(s) {
  return {PENDING:'Menunggu', DOWNLOADING:'Mendownload', PAUSED:'Dijeda', COMPLETED:'Selesai', FAILED:'Gagal', CANCELLED:'Dibatalkan'}[s] || s;
}

function stateBadge(s) {
  const map = {PENDING:'b-paused', DOWNLOADING:'b-active', PAUSED:'b-paused', COMPLETED:'b-done', FAILED:'b-fail', CANCELLED:'b-fail'};
  return '<span class="badge ' + (map[s] || 'b-paused') + '">' + stateLabel(s) + '</span>';
}

function fileIcon(name) {
  const e = extOf(name).toLowerCase();
  if (['mp4','mkv','webm','avi','mov','3gp','m4v'].indexOf(e) >= 0) return '\u{1F3AC}';
  if (['jpg','jpeg','png','gif','webp','bmp'].indexOf(e) >= 0) return '\u{1F5BC}';
  if (['mp3','m4a','aac','wav','ogg','flac'].indexOf(e) >= 0) return '\u{1F3B5}';
  if (e === 'apk') return '\u{1F4E6}';
  if (e === 'pdf') return '\u{1F4C4}';
  if (['zip','rar','7z','tar','gz','xz'].indexOf(e) >= 0) return '\u{1F4E6}';
  if (['txt','md','log','csv'].indexOf(e) >= 0) return '\u{1F4C4}';
  return '\u{1F4CE}';
}

function render(items) {
  const list = document.getElementById('list');
  list.innerHTML = '';
  const filtered = items.filter(function (it) {
    if (webFilter === 'ALL') return true;
    if (webFilter === 'ACTIVE') return it.state === 'DOWNLOADING' || it.state === 'PENDING';
    if (webFilter === 'COMPLETED') return it.state === 'COMPLETED';
    return it.state === 'FAILED' || it.state === 'CANCELLED';
  });
  if (!filtered.length) {
    list.innerHTML = '<li class="item" style="text-align:center;color:var(--muted)">' +
      (items.length ? 'Tidak ada item di filter ini.' : 'Belum ada download. Ketuk + New Download untuk mulai.') + '</li>';
    return;
  }
  for (const it of filtered) {
    const li = document.createElement('li');
    li.className = 'item';
    const prog = it.totalBytes > 0 ? Math.round(it.bytesDownloaded * 100 / it.totalBytes) : 0;
    let meta = it.totalBytes > 0
      ? prog + '% \u00b7 ' + fmt(it.bytesDownloaded) + ' / ' + fmt(it.totalBytes)
      : fmt(it.bytesDownloaded);
    if (it.state === 'DOWNLOADING' && it.speedBps > 0) {
      meta += ' \u00b7 ' + fmtSpeed(it.speedBps);
      if (it.etaSeconds > 0) meta += ' \u00b7 ETA ' + fmtEta(it.etaSeconds);
    }
    const err = it.error ? '<div class="err">' + escapeHtml(it.error) + '</div>' : '';
    const spark = it.state === 'DOWNLOADING' ? sparkSvg(speedHistory[it.id]) : '';
    li.innerHTML =
      '<div class="item-top"><div class="icon">' + fileIcon(it.fileName) + '</div><div class="item-body">' +
      '<div class="name">' + escapeHtml(it.fileName) + '</div>' +
      '<div class="meta">' + stateBadge(it.state) + '<span>' + meta + '</span></div>' + err +
      '<div class="bar"><div class="fill" style="width:' + prog + '%"></div></div>' +
      spark +
      '<div class="actions">' + actionButtons(it) + '</div>' +
      '</div></div>';
    li.querySelectorAll('[data-action]').forEach(b =>
      b.addEventListener('click', () => doAction(it.id, b.dataset.action))
    );
    list.appendChild(li);
  }
}

function actionButtons(it) {
  let s = '';
  const encId = encodeURIComponent(it.id);
  if (it.state === 'COMPLETED') {
    s += '<a class="stream" href="' + API + '/file/' + encId + '" target="_blank">&#9654; Stream</a>';
    s += '<a class="dl" href="' + API + '/file/' + encId + '?dl=1" download>&#11015; Download</a>';
  }
  if (it.state === 'DOWNLOADING') s += '<button data-action="pause">&#9209; Jeda</button>';
  if (it.state === 'PAUSED' || it.state === 'FAILED') s += '<button data-action="resume">&#9654; Lanjut</button>';
  if (it.state === 'DOWNLOADING' || it.state === 'PENDING' || it.state === 'PAUSED') s += '<button data-action="cancel" class="danger">&#10005; Batal</button>';
  if (it.state === 'COMPLETED' || it.state === 'FAILED' || it.state === 'CANCELLED') s += '<button data-action="delete" class="danger">&#128465; Hapus</button>';
  return s;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function doAction(id, action) {
  const body = new URLSearchParams({id: id, action: action});
  await fetch(API + '/api/action', {method: 'POST', body});
  refresh();
}

function globalAction(action) {
  doAction('', action);
}

document.getElementById('pauseAllBtn').addEventListener('click', function () { globalAction('pause_all'); });
document.getElementById('resumeAllBtn').addEventListener('click', function () { globalAction('resume_all'); });
document.getElementById('retryFailedBtn').addEventListener('click', function () { globalAction('retry_failed'); });
document.getElementById('clearCompletedBtn').addEventListener('click', function () { globalAction('clear_completed'); });

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  const body = new URLSearchParams({url: url});
  const name = document.getElementById('name').value.trim();
  if (name) body.append('name', name);
  body.append('speedLimitKbps', document.getElementById('speed').value);
  body.append('priority', document.getElementById('priority').value);
  const checksum = document.getElementById('checksum').value.trim();
  if (checksum) body.append('checksum', checksum);
  body.append('path', document.getElementById('storage').value.trim());
  await fetch(API + '/api/add', {method: 'POST', body});
  document.getElementById('url').value = '';
  document.getElementById('name').value = '';
  toggleAddForm(false);
  refresh();
});

refresh();
refreshStatus();
setInterval(refresh, 1500);
setInterval(refreshStatus, 5000);
</script>
</body>
