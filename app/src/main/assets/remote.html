<title>Download Manager Remote</title>

<style>
  :root {
    --bg: #f4f6fb;
    --bg-soft: #eef1f8;
    --card: #ffffff;
    --ink: #17203a;
    --muted: #64718c;
    --primary: #4353e6;
    --primary-2: #3344d0;
    --primary-soft: #eceefd;
    --accent: #f76707;
    --green: #0f9d58;
    --green-bg: #e6f6ee;
    --red: #d93025;
    --red-bg: #fdeceb;
    --amber: #b26a00;
    --amber-bg: #fdf3e0;
    --blue-bg: #e8eefc;
    --line: #e3e8f2;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(23,32,58,.05);
    --shadow: 0 1px 2px rgba(23,32,58,.04), 0 10px 28px rgba(23,32,58,.07);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); margin: 0; padding: 0 0 56px; color: var(--ink); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .topbar { position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); box-shadow: 0 1px 8px rgba(23,32,58,.04); }
  .topbar-in { max-width: 880px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; margin-right: auto; color: var(--ink); cursor: pointer; }
  .brand .logo { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), #7a5cff); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 3px 8px rgba(67,83,230,.35); }
  .brand small { display: block; font-weight: 500; font-size: 10.5px; opacity: .6; letter-spacing: .3px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s ease; }
  .pill:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .pill.primary { background: linear-gradient(135deg, var(--primary), #5f6ff0); border-color: transparent; color: #fff; box-shadow: 0 3px 10px rgba(67,83,230,.3); }
  .pill.primary:hover { background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: #fff; }
  .wrap { max-width: 880px; margin: 18px auto 0; padding: 0 16px; }
  .status-card { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow-sm); margin-bottom: 16px; font-size: 13px; color: var(--muted); }
  .status-card .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; box-shadow: 0 0 0 3px var(--green-bg); }
  .status-card b { color: var(--ink); font-weight: 700; }
  .status-card .st-item { display: inline-flex; align-items: center; gap: 5px; line-height: 1.35; white-space: nowrap; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .toolbar button { padding: 8px 14px; font-size: 13px; font-weight: 600; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; transition: all .15s ease; }
  .toolbar button:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .toolbar button.busy { opacity: .5; pointer-events: none; }
  .seg { display: flex; gap: 4px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .15s ease; }
  .seg button.on { background: var(--card); color: var(--primary); box-shadow: 0 2px 6px rgba(23,32,58,.10); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 16px; margin-bottom: 16px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select { font-size: 15px; padding: 11px 13px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; transition: border-color .15s ease, box-shadow .15s ease; }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .form-row { display: flex; gap: 10px; }
  .form-row button { flex: 1; padding: 12px; border-radius: var(--radius-sm); border: 0; font-size: 15px; font-weight: 700; cursor: pointer; transition: all .15s ease; }
  .btn-main { background: linear-gradient(135deg, var(--primary), #5f6ff0); color: #fff; box-shadow: 0 3px 10px rgba(67,83,230,.25); }
  .btn-main:hover { background: linear-gradient(135deg, var(--primary-2), var(--primary)); }
  .btn-ghost { background: var(--bg-soft); color: var(--ink); border: 1px solid var(--line) !important; }
  .btn-ghost:hover { background: #e3e8f4; }
  #status { color: var(--red); margin: 4px 0 12px; font-size: 13px; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .b-done { background: var(--green-bg); color: var(--green); }
  .b-active { background: var(--blue-bg); color: var(--primary); }
  .b-paused { background: var(--amber-bg); color: var(--amber); }
  .b-fail { background: var(--red-bg); color: var(--red); }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  li.item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); transition: box-shadow .15s ease; }
  li.item:hover { box-shadow: var(--shadow); }
  .item-top { display: flex; align-items: flex-start; gap: 12px; }
  .icon { flex: 0 0 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--blue-bg); }
  .item-body { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 14.5px; word-break: break-all; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  .bar { height: 5px; background: #e9edf5; border-radius: 999px; overflow: hidden; margin: 8px 0 10px; }
  .fill { height: 100%; background: linear-gradient(90deg, #ffa94d, var(--accent)); width: 0; border-radius: 999px; transition: width .5s ease; }
  .item-sub { padding-left: 54px; }

  .actions a, .actions button { padding: 7px 14px; font-size: 12.5px; font-weight: 600; text-decoration: none; border-radius: 999px; border: 1px solid transparent; cursor: pointer; transition: all .15s ease; }
  a.stream { background: var(--green-bg); color: var(--green); }
  a.stream:hover { border-color: var(--green); }
  a.dl { background: var(--amber-bg); color: var(--amber); }
  a.dl:hover { border-color: var(--amber); }
  .actions button { background: var(--bg-soft); color: var(--ink); }
  .actions button:hover { border-color: var(--muted); }
  .actions button.danger { color: var(--red); }
  .actions button.danger:hover { background: var(--red-bg); border-color: var(--red); }
  .speed-total { display: inline-flex; align-items: center; gap: 5px; padding: 7px 13px; border-radius: 999px; border: 1px solid transparent; background: var(--amber-bg); color: var(--accent); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .speed-total .st-sub { color: var(--muted); font-weight: 600; font-size: 11px; }
  .item-menu-btn { display: none; }
  .spark { width: 100%; height: 26px; display: block; margin-top: 8px; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.6; }
  .conn-banner { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; background: #b00020; color: #fff; font-size: 13px; font-weight: 600; padding: 8px 14px; }
  .conn-banner button { border: 0; border-radius: 999px; background: #fff; color: #b00020; font-weight: 700; font-size: 12.5px; padding: 6px 14px; cursor: pointer; }
  .gal-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .gal-search { margin-bottom: 10px; }
  .gal-toolbar h2 { margin: 0; font-size: 16px; }
  .gal-toolbar .count { font-size: 12px; color: var(--muted); }
  .gal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px 14px; }
  .gal-cell { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform .15s ease, box-shadow .15s ease; }
  .gal-cell:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .gal-thumb { position: relative; aspect-ratio: 16 / 9; background: #1c2230; overflow: hidden; }
  .gal-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gal-thumb .ext { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9aa4b2; font-size: 22px; font-weight: 800; text-transform: uppercase; }
  .gal-thumb .gal-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.18); }
  .gal-thumb .gal-play span { width: 0; height: 0; border-top: 14px solid transparent; border-bottom: 14px solid transparent; border-left: 22px solid rgba(255,255,255,.95); filter: drop-shadow(0 1px 4px rgba(0,0,0,.6)); }
  .gal-thumb .gal-badge { position: absolute; left: 6px; bottom: 6px; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.78); color: #fff; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
  .gal-thumb .del { position: absolute; top: 6px; right: 6px; z-index: 3; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; cursor: pointer; line-height: 1; }
  .gal-thumb .del:hover { background: var(--red); }
  .gal-info { padding: 9px 11px 11px; }
  .gal-info .n { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.35; min-height: 2.7em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .gal-info .m { margin-top: 3px; font-size: 11.5px; color: var(--muted); }
  .gal-sentinel { grid-column: 1 / -1; height: 24px; }
  #galleryStatus { color: var(--red); font-size: 13px; margin-bottom: 8px; }
  .fs-path { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 10px; margin-bottom: 8px; word-break: break-all; }
  .fs-crumb { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; background: var(--bg-soft); border: 1px solid var(--line); font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .fs-crumb:hover { color: var(--primary); border-color: var(--primary); }
  .fs-crumb.on { background: var(--primary-soft); color: var(--primary); cursor: default; }
  .fs-crumb-sep { color: var(--muted); opacity: .55; padding: 0 1px; }
  .fs-more-btn { display: none; }
  .fs-list { display: flex; flex-direction: column; gap: 6px; }
  .fs-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow-sm); transition: border-color .15s ease; }
  .fs-row.fs-dir { cursor: pointer; }
  .fs-row.fs-dir:hover { border-color: var(--primary); }
  .fs-row .icon { flex: 0 0 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; background: var(--blue-bg); }
  .fs-row .fs-main { flex: 1 1 140px; min-width: 0; }
  .fs-row .fs-name { font-weight: 700; font-size: 13px; word-break: break-all; }
  .fs-row .fs-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .fs-row .fs-actions { flex: 1 1 100%; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .fs-row .fs-actions a, .fs-row .fs-actions button { padding: 4px 10px; font-size: 11.5px; font-weight: 600; text-decoration: none; border-radius: 999px; border: 1px solid transparent; cursor: pointer; transition: all .15s ease; }
  .fs-actions a, .fs-actions button { background: var(--bg-soft); color: var(--ink); }
  .fs-actions a.fs-stream { background: var(--green-bg); color: var(--green); }
  .fs-actions a.fs-stream:hover { border-color: var(--green); }
  .fs-actions a.fs-dl { background: var(--amber-bg); color: var(--amber); }
  .fs-actions a.fs-dl:hover { border-color: var(--amber); }
  .fs-actions button:hover { border-color: var(--muted); }
  .fs-actions button.danger { color: var(--red); margin-left: auto; }
  .fs-actions button.danger:hover { background: var(--red-bg); border-color: var(--red); }
  .fs-root { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; margin-bottom: 8px; box-shadow: var(--shadow-sm); transition: border-color .15s ease; }
  .fs-root:hover { border-color: var(--primary); }
  .fs-root .fs-rcap small { display: block; color: var(--muted); font-size: 12px; word-break: break-all; margin-top: 2px; }
  .btn-ghost:disabled { opacity: .45; cursor: default; }
  .fs-tools { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .fs-tools button { flex: 1 1 0; min-width: 0; padding: 8px 12px; font-size: 12.5px; font-weight: 600; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; transition: all .15s ease; }
  .fs-tools button:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .fs-up-wrap { position: relative; flex: 1 1 0; min-width: 0; display: flex; }
  .fs-up-wrap > button { width: 100%; }
  #fsUpMenu { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: var(--shadow); }
  #fsUpMenu button { display: block; width: 100%; padding: 9px 10px; font-size: 12.5px; font-weight: 600; border: 0; border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer; text-align: left; }
  #fsUpMenu button:hover { background: var(--bg-soft); color: var(--primary); }

  .fs-upload-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }

  .fs-upload .bar { height: 6px; border-radius: 999px; background: var(--primary-soft); overflow: hidden; }

  .fs-batch { display: flex; align-items: center; gap: 8px; background: var(--primary-soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }

  html[data-theme="dark"] {
    --bg: #0e1117;
    --bg-soft: #171c26;
    --card: #1a202b;
    --ink: #e6ebf4;
    --muted: #93a1b5;
    --primary: #6d7dff;
    --primary-2: #5564f0;
    --primary-soft: #232b45;
    --accent: #ff8f2b;
    --green: #3fbf77;
    --green-bg: #123524;
    --red: #ff7a7a;
    --red-bg: #3a1717;
    --amber: #f5a623;
    --amber-bg: #3a2c0e;
    --blue-bg: #1d2c4d;
    --line: #262e3c;
  }

  html[data-theme="dark"] .actions a.dl, html[data-theme="dark"] a.fs-dl { background: var(--amber-bg); color: var(--amber); }

  .fab:active { transform: scale(.92); }

<body>

<script>
const API = '';
const connBanner = document.getElementById('connBanner');
const connBannerText = document.getElementById('connBannerText');
const connReloadBtn = document.getElementById('connReloadBtn');
let connReloadTarget = '';
function showConnBanner(msg, target) {
  connBannerText.textContent = msg;
  connReloadTarget = target || '';
  connBanner.classList.remove('hidden');
}
function hideConnBanner() {
  connBanner.classList.add('hidden');
}
connReloadBtn.addEventListener('click', function () {
  if (connReloadTarget) window.location.href = connReloadTarget;
  else window.location.reload();
});
const themeBtn = document.getElementById('themeBtn');
const THEME_ORDER = ['auto', 'light', 'dark'];
function systemDark() {
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyTheme(theme) {
  const resolved = (theme === 'dark' || (theme === 'auto' && systemDark())) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', resolved);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', resolved === 'dark' ? '#0e1116' : '#4353e6');
  localStorage.setItem('dm_theme', theme);
  themeBtn.textContent = theme === 'light' ? '\u{1F31E}' : (theme === 'dark' ? '\u{1F319}' : '\u{1F317}');
  themeBtn.title = theme === 'auto' ? 'Tema: otomatis' : (theme === 'dark' ? 'Tema: gelap' : 'Tema: terang');
}
applyTheme(localStorage.getItem('dm_theme') || 'auto');
themeBtn.addEventListener('click', function () {
  const cur = localStorage.getItem('dm_theme') || 'auto';
  applyTheme(THEME_ORDER[(THEME_ORDER.indexOf(cur) + 1) % THEME_ORDER.length]);
});
(function () {
  const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
  if (!mq) return;
  const on = function () {
    if ((localStorage.getItem('dm_theme') || 'auto') === 'auto') applyTheme('auto');
  };
  if (mq.addEventListener) mq.addEventListener('change', on);
  else if (mq.addListener) mq.addListener(on);
})();

let failCount = 0;
let currentItems = [];
let webFilter = 'ALL';
const WEB_FILTERS = {ALL:'webFilterAll', ACTIVE:'webFilterActive', COMPLETED:'webFilterCompleted', FAILED:'webFilterFailed'};
Object.entries(WEB_FILTERS).forEach(function (e) {
  document.getElementById(e[1]).addEventListener('click', function () {
    webFilter = e[0];
    Object.entries(WEB_FILTERS).forEach(function (f) {
      document.getElementById(f[1]).classList.toggle('on', f[0] === webFilter);
    });
    refresh();
  });
});

const addForm = document.getElementById('addForm');
const newBtn = document.getElementById('newBtn');
let pendingAddForm = false;
function toggleAddForm(show) {
  addForm.classList.toggle('hidden', !show);
  newBtn.textContent = show ? '\u2715 Tutup' : '+ New Download';
  if (show) document.getElementById('url').focus();
}
function onNewDownloadClick() {
  if (currentRoute() !== 'downloads') {
    pendingAddForm = true;
    location.hash = '#/';
  } else {
    toggleAddForm(addForm.classList.contains('hidden'));
  }
}
newBtn.addEventListener('click', onNewDownloadClick);
document.getElementById('fabNewBtn').addEventListener('click', onNewDownloadClick);

document.getElementById('cancelAdd').addEventListener('click', function () {
  toggleAddForm(false);
});

function renderStatus(st) {
  const el = document.getElementById('deviceStatus');
  if (!el) return;
  let text = '<span class="st-item"><span class="dot"></span><b>Device terhubung</b></span>';
  if (st.batteryPercent >= 0) {
    text += '<span class="st-item">&#128267; Baterai <b>' + st.batteryPercent + '%</b>' + (st.batteryCharging ? ' (mengisi)' : '') + '</span>';
  } else {
    text += '<span class="st-item">&#128267; Baterai ?</span>';
  }
  if (typeof st.storageFree === 'number') {
    text += '<span class="st-item">&#128190; Sisa <b>' + fmt(st.storageFree) + '</b></span>';
  }
  text += '<span class="st-item">&#128424; Port <b>' + st.port + '</b></span>';
  el.innerHTML = text;
  el.classList.remove('offline');
  if (st.port && location.port && Number(st.port) !== Number(location.port)) {
    const proto = location.protocol;
    const host = location.hostname;
    showConnBanner(
      'Server pindah ke port ' + st.port + ' — muat ulang ke alamat baru.',

function mmFmtTime(t) {
  if (!isFinite(t) || t < 0) t = 0;
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const sec = Math.floor(t % 60);
  const mm = String(sec).padStart(2, '0');
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + mm : m + ':' + mm;
}

function mmShowToast(text) {
  mmToast.textContent = text;
  mmToast.classList.remove('hidden');
  clearTimeout(mmToast._t);
  mmToast._t = setTimeout(function () { mmToast.classList.add('hidden'); }, 700);
}

function mmShowCtrl() {
  mmCtrl.classList.remove('hide');

  if (mmType === 'video' && !mmVideo.paused) {
    mmTimer = setTimeout(function () { mmCtrl.classList.add('hide'); }, 3200);
  }
}

function vposKey(token) {
  return 'dm_vpos_' + token;
}

function saveVideoPos(token) {
  if (!token || mmType !== 'video') return;
  const d = mmVideo.duration || 0;
  const t = mmVideo.currentTime || 0;
  if (d <= 0) return;
  if (t < 5 || d - t < 10) {
    try { localStorage.removeItem(vposKey(token)); } catch (e) {}
    return;
  }
  try { localStorage.setItem(vposKey(token), JSON.stringify({ t: t, d: d })); } catch (e) {}
}

function loadVideoPos(token) {
  try {
    const raw = localStorage.getItem(vposKey(token));
    if (!raw) return 0;
    const o = JSON.parse(raw);
    return (o && typeof o.t === 'number' && o.t > 0) ? o.t : 0;
  } catch (e) { return 0; }
}

function mmSeekUI() {
  const d = mmVideo.duration || 0;
  const t = mmVideo.currentTime || 0;
  const pct = d ? (t / d) * 1000 : 0;
  mmSeek.value = Math.round(pct);
  mmSeek.style.setProperty('--fill', (pct / 10).toFixed(1) + '%');
  mmTime.textContent = mmFmtTime(t) + ' / ' + mmFmtTime(d);
}

function mmUpdateBuffer() {
  const d = mmVideo.duration || 0;
  if (!d || !mmVideo.buffered || !mmVideo.buffered.length) return;
  const end = mmVideo.buffered.end(mmVideo.buffered.length - 1);
  mmBuf.style.width = Math.min(100, (end / d) * 100).toFixed(1) + '%';
}

}

async function loadGallery(reset) {
  if (galleryLoading) return;
  galleryLoading = true;
  if (reset) showGallerySkeleton();
  try {
    const q = gallerySearch ? gallerySearch.value.trim() : '';
    const params = new URLSearchParams();
    params.set('page', reset ? 0 : galleryPage);
    if (q) params.set('q', q);
    const res = await fetch(API + '/api/gallery?' + params.toString());
    if (res.status === 401) {
      galleryStatus.textContent = 'PIN diperlukan. Muat ulang halaman untuk login.';
      galleryGrid.innerHTML = '';
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    galleryStatus.textContent = '';
    const items = data.items || [];
    if (reset) {
      galleryItems = items;
      galleryPage = 1;
      galleryLoaded = 0;
      galleryGrid.innerHTML = '';
      galleryCount.textContent = (data.total || items.length) + ' file';
      if (!items.length) {
        galleryGrid.innerHTML = emptyHtml(
          '\u{1F50D}',
          q ? 'Tidak ada hasil' : 'Belum ada foto/video',
          q ? 'Coba kata kunci lain.' : 'File di folder download akan muncul di sini.'
        );
        galleryHasMore = false;
        galleryLoading = false;
        return;
      }
    } else {
      galleryItems = galleryItems.concat(items);
      galleryPage++;
    }
    galleryHasMore = !!data.hasMore;
    loadMoreGallery();
  } catch (e) {
    if (reset) {
      galleryStatus.textContent = 'Gagal memuat galeri: ' + e;
      galleryGrid.innerHTML = emptyHtml('\u26A0\uFE0F', 'Gagal memuat galeri', String(e));
    }
  }
  galleryLoading = false;
}

function showGallerySkeleton() {
  galleryLoaded = 0;
  let html = '<div class="sk-grid">';
  for (let i = 0; i < 6; i++) {
    html += '<div class="sk-cell"><div class="sk-thumb skeleton"></div><div class="sk-cap">' +
      '<div class="sk-line w60 skeleton"></div><div class="sk-line w40 skeleton"></div></div></div>';
  }
  galleryGrid.innerHTML = html + '</div>';
}

function ensureGallerySentinel() {
  if (!gallerySentinel) {
    gallerySentinel = document.createElement('div');
    gallerySentinel.className = 'gal-sentinel';
    galleryGrid.appendChild(gallerySentinel);
  }
}

function loadMoreGallery() {
  if (galleryLoaded < galleryItems.length) {
    const next = galleryItems.slice(galleryLoaded, galleryLoaded + GALLERY_CHUNK);
    for (const it of next) renderGalleryCell(it);
    galleryLoaded += next.length;
  }
  if (galleryLoaded < galleryItems.length || galleryHasMore) {
    ensureGallerySentinel();
    if (galleryLoaded >= galleryItems.length) loadGallery(false);
  } else if (gallerySentinel) {
    gallerySentinel.remove();
    gallerySentinel = null;
  }
}

function parentFsPath(p) {
  if (!p) return '';
  if (p.startsWith('m:')) {
    const rel = p.slice(2);
    const idx = rel.lastIndexOf('/');
    if (idx <= 0) return 'm:Download';
    return 'm:' + rel.slice(0, idx);
  }
  const idx = p.lastIndexOf('/');
  const up = idx > 0 ? p.slice(0, idx) : '';
  return (up === 'f:' || up === 'm:') ? '' : up;
}

function fsMsg(text, isErr) {
  fsStatus.textContent = text || '';
  fsStatus.style.color = isErr ? 'var(--red)' : 'var(--green)';
}

function fsCrumbParts(p) {
  if (!p) return [];
  const prefix = p.indexOf('m:') === 0 ? 'm:' : 'f:';
  const rel = p.slice(2).replace(/^\/+|\/+$/g, '');
  const segs = rel.split('/').filter(Boolean);
  const parts = [{label: '\u{1F4C1} Penyimpanan', path: ''}];
  let cur = prefix;
  segs.forEach(function (seg) {
    cur += '/' + seg;
    parts.push({label: seg, path: cur});
  });
  return parts;
}

function renderFsCrumbs(p) {
  if (!p) {
    fsPathEl.textContent = 'Pilih lokasi penyimpanan';
    return;
  }
  const parts = fsCrumbParts(p);
  fsPathEl.innerHTML = parts.map(function (part, i) {
    const last = i === parts.length - 1;
    const chip = '<span class="fs-crumb' + (last ? ' on' : '') + '" data-path="' + encodeURIComponent(part.path) + '">' + escapeHtml(part.label) + '</span>';
    return chip + (last ? '' : '<span class="fs-crumb-sep">\u203A</span>');
  }).join('');
  fsPathEl.querySelectorAll('.fs-crumb[data-path]').forEach(function (chip) {
    if (chip.classList.contains('on')) return;
    chip.addEventListener('click', function () {
      fsPath = decodeURIComponent(chip.dataset.path);
      loadFs();
    });
  });
}

async function loadFs() {
  showFsSkeleton();
  try {
    const res = await fetch(API + '/api/fs?path=' + encodeURIComponent(fsPath));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    fsStatus.textContent = '';
    renderFsCrumbs(fsPath);
    fsUpBtn.disabled = !fsPath;
    fsToolsRow.classList.toggle('hidden', !fsPath);
    fsSelectBtn.classList.toggle('hidden', !fsPath);
    fsItems = data.items || [];
    fsCount.textContent = fsItems.length ? fsItems.length + ' item' : '';
    renderFs(fsItems);
  } catch (e) {
    fsMsg('Gagal memuat: ' + e, true);
    fsList.innerHTML = emptyHtml('\u26A0\uFE0F', 'Gagal memuat folder', String(e));
  }
}

function showFsSkeleton() {
  let html = '<div class="sk-list">';
  for (let i = 0; i < 4; i++) {
    html += '<div class="sk-item"><div class="sk-ico skeleton"></div><div class="sk-lines">' +
      '<div class="sk-line w60 skeleton"></div><div class="sk-line w40 skeleton"></div></div></div>';
  }
  fsList.innerHTML = html + '</div>';
}

function renderFs(items) {
  const box = fsList;
  box.innerHTML = '';
  if (!fsPath) {
    if (!items.length) {
      box.innerHTML = emptyHtml('\u{1F4BE}', 'Tidak ada penyimpanan tersedia', '');
      return;
    }
    for (const r of items) {
      const row = document.createElement('div');
      row.className = 'fs-root';
      row.innerHTML = '<div class="icon">&#128193;</div>' +
        '<div class="fs-main"><div class="fs-name">' + escapeHtml(r.name) + '</div>' +
        '<div class="fs-rcap"><small>' + escapeHtml(r.path) + '</small></div></div>';
      row.addEventListener('click', function () {
        fsPath = r.path;
        loadFs();
      });
      box.appendChild(row);
    }
    return;
  }
  if (!items.length) {
    box.innerHTML = emptyHtml('\u{1F4C1}', 'Folder kosong', 'Tidak ada file di folder ini.');
    return;
  }
  for (const it of items) {
    const row = document.createElement('div');
    row.className = 'fs-row';
    if (it.kind === 'dir') row.classList.add('fs-dir');
    const icon = it.kind === 'dir' ? '\u{1F4C1}' : fileIcon(it.name);
    let meta = '';
    if (it.kind === 'file') {
      meta = fmt(it.size);
      if (it.modified > 0) meta += ' \u00b7 ' + fmtDate(it.modified);
    } else if (it.itemCount >= 0) {
      meta = it.itemCount + ' item';
      if (it.totalSize > 0) meta += ' \u00b7 ' + fmt(it.totalSize);
    }
    const selIdx = fsSelected.indexOf(it);
    const check = fsSelectMode
      ? '<span class="fs-check' + (selIdx >= 0 ? ' on' : '') + '">' + (selIdx >= 0 ? '\u2713' : '') + '</span>'
      : '';
    let actions = '';
    if (!fsSelectMode) {
      if (it.kind === 'file') {
        const media = API + '/api/media?token=' + encodeURIComponent(it.token);
        if (FS_MEDIA_EXTS.indexOf(extOf(it.name).toLowerCase()) >= 0) {
          actions += '<a class="fs-stream" href="' + media + '" target="_blank">&#9654; Stream</a>';
        }
        actions += '<a class="fs-dl" href="' + media + '?dl=1" download>&#11015; Download</a>';
      } else {
        actions += '<a class="fs-dl" href="' + API + '/api/fs_zip?path=' +
          encodeURIComponent(it.path) + '" download title="Download folder sebagai ZIP">&#128230; ZIP</a>';
      }
      actions += '<button data-op="rename">&#9998; Rename</button>';
      actions += '<button data-op="move">&#10145; Pindah</button>';
      actions += '<button data-op="delete" class="danger">&#128465; Hapus</button>';
    }
    row.innerHTML =
      check + '<div class="icon">' + icon + '</div>' +
      '<div class="fs-main"><div class="fs-name">' + escapeHtml(it.name) + '</div>' +
      (meta ? '<div class="fs-meta">' + meta + '</div>' : '') + '</div>' +
      (!fsSelectMode ? '<button class="fs-more-btn" type="button" title="Aksi">\u22EF</button>' : '') +
      (actions ? '<div class="fs-actions">' + actions + '</div>' : '');
    row.addEventListener('click', function () {
      if (fsLpFired) { fsLpFired = false; return; }
      if (fsSelectMode) {
        toggleFsSelect(it, row);
      } else if (it.kind === 'dir') {
        fsPath = it.path;
        loadFs();
      } else if (FS_MEDIA_EXTS.indexOf(extOf(it.name).toLowerCase()) >= 0) {
        fsOpenMedia(it);
      }
    });
    attachFsLongPress(row, it);
    const moreBtn = row.querySelector('.fs-more-btn');
    if (moreBtn) {
      moreBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        openFsSheet(it);
      });
    }
    row.querySelectorAll('[data-op]').forEach(function (b) {
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        doFsOp(it, b.dataset.op);
      });
    });
    box.appendChild(row);
  }
}

function attachFsLongPress(row, it) {
  const start = function (ev) {
    if (fsSelectMode || ev.target.closest('button,a')) return;
    fsLpFired = false;
    clearTimeout(fsLpTimer);
    fsLpTimer = setTimeout(function () {
      fsLpFired = true;
      fsSelectMode = true;
      fsSelectBtn.textContent = '\u2715 Batal pilih';
      fsSelected.length = 0;
      fsSelected.push(it);
      renderFs(fsItems);
      updateFsBatch();
    }, 480);
  };
  const end = function () { clearTimeout(fsLpTimer); };
  row.addEventListener('touchstart', start, {passive: true});
  row.addEventListener('touchend', end);
  row.addEventListener('touchmove', end);
  row.addEventListener('touchcancel', end);
  row.addEventListener('mousedown', start);
  row.addEventListener('mouseup', end);
  row.addEventListener('mouseleave', end);
}

function toggleFsSelect(it, row) {
  const idx = fsSelected.indexOf(it);
  if (idx >= 0) {
    fsSelected.splice(idx, 1);
  } else {
    fsSelected.push(it);
  }
  const check = row.querySelector('.fs-check');
  check.classList.toggle('on', fsSelected.indexOf(it) >= 0);
  check.textContent = fsSelected.indexOf(it) >= 0 ? '\u2713' : '';
  updateFsBatch();
}

function updateFsBatch() {
  fsBatch.classList.toggle('hidden', fsSelected.length === 0);
  document.getElementById('fsBatchCount').textContent = fsSelected.length + ' dipilih';

const fsSheet = document.getElementById('fsSheet');
function fsDownloadUrl(url) {
  const a = document.createElement('a');
  a.href = url;
  a.download = '';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { a.remove(); }, 1000);
}
function openFsSheet(it) {
  document.getElementById('fsSheetTitle').textContent = it.name;
  const list = document.getElementById('fsSheetList');
  list.innerHTML = '';
  const acts = [];
  if (it.kind === 'file') {
    const media = API + '/api/media?token=' + encodeURIComponent(it.token);
    acts.push({label: '\u25B6 Stream', stream: media});
    acts.push({label: '\u2B07 Download', dl: media + '?dl=1'});
  } else {
    acts.push({label: '\u{1F4E6} Download folder (ZIP)', dl: API + '/api/fs_zip?path=' + encodeURIComponent(it.path)});
  }
  acts.push({label: '\u270E Rename', op: 'rename'});
  acts.push({label: '\u27A1 Pindah', op: 'move'});
  acts.push({label: '\u{1F5D1} Hapus', op: 'delete', danger: true});
  acts.forEach(function (a) {
    const b = document.createElement('button');
    b.type = 'button';
    if (a.danger) b.className = 'danger';
    b.textContent = a.label;
    b.addEventListener('click', function () {
      closeFsSheet();
      if (a.stream) { window.open(a.stream, '_blank'); return; }
      if (a.dl) { fsDownloadUrl(a.dl); return; }
      doFsOp(it, a.op);
    });
    list.appendChild(b);
  });
  fsSheet.classList.remove('hidden');
}
function closeFsSheet() {
  fsSheet.classList.add('hidden');
}
document.getElementById('fsSheetCancel').addEventListener('click', closeFsSheet);
fsSheet.addEventListener('click', function (e) {
  if (e.target === fsSheet) closeFsSheet();
});

const itemSheet = document.getElementById('itemSheet');
function openItemSheet(it) {
  document.getElementById('itemSheetTitle').textContent = it.fileName;
  const list = document.getElementById('itemSheetList');
  list.innerHTML = '';
  const encId = encodeURIComponent(it.id);
  const acts = [];
  if (it.state === 'COMPLETED') {
    acts.push({label: '\u25B6 Stream', stream: API + '/file/' + encId});
    acts.push({label: '\u2B07 Download', dl: API + '/file/' + encId + '?dl=1'});
    acts.push({label: '\u{1F517} Bagikan', op: 'share'});
    acts.push({label: '\u270F Ubah nama', op: 'rename'});
  }
  if (it.state === 'DOWNLOADING') acts.push({label: '\u23F8 Jeda', op: 'pause'});
  if (it.state === 'PAUSED' || it.state === 'FAILED') acts.push({label: '\u25B6 Lanjut', op: 'resume'});
  if (it.state === 'PENDING' || it.state === 'PAUSED' || it.state === 'FAILED') {
    acts.push({label: '\u23F1 Batas kecepatan', op: 'limit'});
  }
  if (it.state === 'DOWNLOADING' || it.state === 'PENDING' || it.state === 'PAUSED') {
    acts.push({label: '\u2715 Batal', op: 'cancel'});
  }
  if (it.state === 'COMPLETED' || it.state === 'FAILED' || it.state === 'CANCELLED') {
    acts.push({label: '\u{1F5D1} Hapus', op: 'delete', danger: true});
  }
  acts.forEach(function (a) {
    const b = document.createElement('button');
    b.type = 'button';
    if (a.danger) b.className = 'danger';
    b.textContent = a.label;
    b.addEventListener('click', function () {
      closeItemSheet();
      if (a.stream) { window.open(a.stream, '_blank'); return; }
      if (a.dl) { fsDownloadUrl(a.dl); return; }
      if (a.op === 'rename') {
        showInput('Ubah nama', it.fileName, 'Nama baru untuk file ini', 'Simpan', function (name) {
          if (!name || name === it.fileName) return;
          doActionNow(it.id, 'rename', {name: name});
        });
        return;
      }
      if (a.op === 'limit') {
        showInput(
          'Batas kecepatan',
          String(it.speedLimitKbps || 0),
          'KB/s (0 = tanpa batas). Opsional prioritas -1/0/1 di belakang, contoh: 512 1',
          'Simpan',
          function (val) {
            const parts = val.trim().split(/\s+/);
            const speed = parseInt(parts[0], 10);
            if (isNaN(speed) || speed < 0) return;
            const priority = parts.length > 1 ? parseInt(parts[1], 10) : 0;
            doActionNow(it.id, 'limit_priority', {
              speedLimitKbps: speed,
              priority: isNaN(priority) ? 0 : priority
            });
          }
        );
        return;
      }
      doAction(it.id, a.op);
    });
    list.appendChild(b);
  });
  itemSheet.classList.remove('hidden');
}
function closeItemSheet() {
  itemSheet.classList.add('hidden');
}
document.getElementById('itemSheetCancel').addEventListener('click', closeItemSheet);
itemSheet.addEventListener('click', function (e) {
  if (e.target === itemSheet) closeItemSheet();
});

function fsOpenMedia(it) {
  const token = encodeURIComponent(it.token);
  const media = API + '/api/media?token=' + token;
  const isVideo = ['mp4','mkv','webm','avi','mov','3gp','m4v','mpg','mpeg'].indexOf(extOf(it.name).toLowerCase()) >= 0;
  openMedia(
    {name: it.name, size: it.size, modified: it.modified, token: it.token, isVideo: isVideo},
    media
  );
}

async function doFsOp(it, op) {
  if (op === 'delete') {
    showConfirm('Hapus ' + (it.kind === 'dir' ? 'folder' : 'file') + '?',
      'Hapus \"' + it.name + '\" dari device? Folder dihapus beserta isinya.',
      'Hapus',
      function () {
        postFsAction({action: 'delete', path: it.path}).then(loadFs);
      });
  } else if (op === 'rename') {
    showInput('Rename', it.name, 'Nama baru untuk \"' + it.name + '\"', 'Rename',
      function (name) {
        if (!name) return;
        postFsAction({action: 'rename', path: it.path, name: name}).then(loadFs);
      });
  } else if (op === 'move') {
    showInput('Pindah', fsPath, 'Path folder tujuan di device\nContoh: f:/storage/emulated/0/Download/sub\natau: m:Download/sub', 'Pindah',
      function (dest) {
        if (!dest) return;
        postFsAction({action: 'move', path: it.path, dest: dest}).then(loadFs);
      });
  }
}

async function postFsAction(params) {
  const body = new URLSearchParams();
  Object.entries(params).forEach(function (e) { body.append(e[0], e[1]); });
  const res = await fetch(API + '/api/fs_action', {method: 'POST', body});
  const data = await res.json();
  if (!data.ok) fsMsg('Operasi gagal', true);
}

const UPLOAD_CHUNK = 2 * 1024 * 1024;

let fsUploading = false;

function uploadFiles(files, path, statusEl, progressBox, progressText, progressPct, progressBar, done) {
  fsUploading = true;
  const jobs = Array.from(files).map(function (f) {
    return (f && f.file) ? f : { file: f, path: path };
  });
  const total = jobs.length;
  if (!total) return;
  const failed = [];
  let idx = 0;
  let sentBytes = 0;
  let totalBytes = 0;
  for (const j of jobs) totalBytes += j.file.size;
  let lastProgress = 0;
  let lastTime = Date.now();
  let speed = 0;
  progressBox.classList.remove('hidden');

  function uploadOne(job, attempt) {
    const file = job.file;
    const target = job.path;
    statusEl.textContent = 'Mengunggah ' + file.name + ' (' + (idx + 1) + '/' + total + ')' +
      (attempt > 1 ? ' \u00b7 coba ke-' + attempt : '') + ' \u2026';
    progressText.textContent = file.name + (attempt > 1 ? ' (coba ' + attempt + ')' : '');
    const id = Math.random().toString(36).slice(2) + Date.now().toString(36);
    const chunks = Math.max(1, Math.ceil(file.size / UPLOAD_CHUNK));
    let chunkIdx = 0;
    let chunkFails = 0;

    function nextChunk() {
      if (chunkIdx >= chunks) {
        sentBytes += file.size;
        lastProgress = sentBytes;
        finishOne();
        return;
      }
      const start = chunkIdx * UPLOAD_CHUNK;
      const end = Math.min(start + UPLOAD_CHUNK, file.size);
      lastProgress = Math.max(lastProgress, sentBytes + start);
      lastTime = Date.now();
      const xhr = new XMLHttpRequest();
      xhr.open('POST', API + '/api/upload?name=' + encodeURIComponent(file.name) +
        '&path=' + encodeURIComponent(target) +
        '&id=' + encodeURIComponent(id) +
        '&chunk=' + chunkIdx + '&chunks=' + chunks +
        '&offset=' + start);
      xhr.timeout = 90000;
      xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        const now = Date.now();
        const progress = Math.max(lastProgress, sentBytes + start + e.loaded);
        const dt = (now - lastTime) / 1000;
        if (dt >= 0.3 && progress > lastProgress) {
          speed = (progress - lastProgress) / dt;
          lastTime = now;
          lastProgress = progress;
        }
        const pct = totalBytes > 0 ? Math.round(progress * 100 / totalBytes) : 0;
        progressBar.style.width = pct + '%';
        progressPct.textContent = pct + '% \u00b7 ' + fmtSpeed(speed);
      };
      xhr.onload = function () {
        let ok = false;
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            ok = xhr.responseText && JSON.parse(xhr.responseText).ok;
          } catch (e) {}
        }
        if (ok) {
          chunkIdx++;
          chunkFails = 0;
          nextChunk();
        } else {
          retryChunk();
        }
      };
      xhr.onerror = function () { retryChunk(); };
      xhr.onabort = function () { retryChunk(); };
      xhr.ontimeout = function () { retryChunk(); };
      xhr.send(file.slice(start, end));
    }

    function retryChunk() {
      chunkFails++;
      if (chunkFails < 4) {
        setTimeout(nextChunk, 600);
        return;
      }
      if (attempt < 3) {
        setTimeout(function () { uploadOne(job, attempt + 1); }, 800);
        return;
      }
      failed.push(file.name);
      statusEl.textContent = 'Gagal: ' + file.name;
      finishOne();
    }

    nextChunk();
  }

  function finishOne() {
    idx++;
    if (idx >= total) {
      progressBox.classList.add('hidden');
      fsUploading = false;
      if (done) done(failed.length === 0, failed);
      return;
    }
    uploadOne(jobs[idx], 1);
  }

  uploadOne(jobs[0], 1);
}

// Auto-lock: minta PIN lagi setelah 10 menit tanpa aktivitas
(function () {
  const LOCK_MS = 10 * 60 * 1000;
  let timer = null;
  let lastMove = 0;
  function arm() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      window.location.href = API + '/api/logout';
    }, LOCK_MS);
  }
  fetch(API + '/api/pin_enabled').then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.enabled) return;
    arm();
    document.addEventListener('click', arm, { passive: true });
    document.addEventListener('touchstart', arm, { passive: true });
    document.addEventListener('keydown', arm, { passive: true });
    document.addEventListener('scroll', arm, { passive: true });
    document.addEventListener('mousemove', function () {
      const now = Date.now();
      if (now - lastMove > 1000) { lastMove = now; arm(); }
    }, { passive: true });
  }).catch(function () {});
})();

function fsUploadJobsFrom(files) {
  return Array.from(files).map(function (f) {
    const rel = f.webkitRelativePath || '';
    const idx = rel.lastIndexOf('/');
    const sub = idx > 0 ? rel.slice(0, idx) : '';
    return { file: f, path: sub ? (fsPath ? fsPath + '/' + sub : sub) : fsPath };
  });
}

function startFsUpload(jobs) {
  if (!jobs.length) return;
  const btn = document.getElementById('fsUploadBtn');
  btn.disabled = true;
  uploadFiles(
    jobs,
    fsPath,
    fsStatus,
    document.getElementById('fsProgressBox'),
    document.getElementById('fsProgressText'),
    document.getElementById('fsProgressPct'),
    document.getElementById('fsProgressBar'),
    function (ok, failed) {
      btn.disabled = false;
      fsUploadFile.value = '';
      fsUploadDir.value = '';
      if (ok) {
        fsMsg('Selesai: ' + jobs.length + ' file diunggah');
      } else {
        fsMsg(jobs.length - failed.length + ' berhasil, ' + failed.length + ' gagal: ' + failed.join(', '), true);
      }
      loadFs();
    }
  );
}

  e.preventDefault();
  fsList.classList.remove('fs-drag');

  startFsUpload(fsUploadJobsFrom(dt.files));
});

function extOf(name) {
  const i = name.lastIndexOf('.');
  return i >= 0 ? name.slice(i + 1).slice(0, 6) : '\u2699';
}

function fmtDate(ms) {
  const d = new Date(ms);
  return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()] + ' ' + d.getFullYear();
}

async function doDeleteMedia(token, ok) {
  const body = new URLSearchParams({token: token});
  try {
    const res = await fetch(API + '/api/delete_media', {method: 'POST', body});
    const data = await res.json();
    if (data.ok) {
      if (ok) ok();
    } else {
      alert('Gagal menghapus: ' + (data.error || '?'));
    }
  } catch (e) {
    alert('Gagal menghapus: ' + e);
  }
}

function openMedia(it, src) {
  mmType = it.isVideo ? 'video' : 'image';
  mmCurrentToken = it.token;
  mmLastSave = 0;
  mmTitle.textContent = it.name;
  mmSub.textContent = fmt(it.size) + (it.modified > 0 ? ' \u00b7 ' + fmtDate(it.modified) : '') + (it.isVideo ? ' \u00b7 video' : ' \u00b7 foto');
  mmDesc.classList.remove('hidden');
  mmBody.scrollTop = 0;
  mmImage.classList.add('hidden');
  mmImage.removeAttribute('src');
  mmPlayer.classList.add('hidden');
  mmVideo.pause();
  mmVideo.removeAttribute('src');
  mmBuf.style.width = '0%';
  mmSeek.value = 0;
  mmSeek.style.setProperty('--fill', '0%');
  mmTime.textContent = '0:00 / 0:00';
  if (mmType === 'video') {
    mmPlayer.classList.remove('hidden');
    mmBigPlay.classList.remove('hidden');
    mmSpinner.classList.add('hidden');
    mmCtrl.classList.remove('hidden');
    mmCtrl.classList.remove('hide');
    mmResetSpeed();
    mmPlayBtn.innerHTML = ICONS.play;
    mmMuteBtn.innerHTML = mmVideo.muted ? ICONS.mute : ICONS.sound;
    mmFsBtn.innerHTML = (document.fullscreenElement || document.webkitFullscreenElement) ? ICONS.fsx : ICONS.fs;
    mmVideo.src = src;
    mmVideo.load();
    var p = mmVideo.play();
    if (p && p.catch) {
      p.catch(function () { mmBigPlay.classList.remove('hidden'); mmShowCtrl(); });
    }
  } else {
    mmImage.src = src;
    mmImage.classList.remove('hidden');
  }
  renderRelated(it);
  mediaModal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderRelated(current) {
  mmRelated.innerHTML = '';
  if (mmType !== 'video') {
    mmRelated.classList.add('hidden');
    return;
  }
  const others = galleryItems.filter(function (v) {
    return v.isVideo && v.token !== current.token;
  }).slice(0, 8);
  mmRelated.classList.remove('hidden');
  if (!others.length) {
    mmRelated.innerHTML = '<div class="mm-rel-empty">Belum ada video lain di galeri.</div>';
    return;
  }
  const head = document.createElement('div');
  head.className = 'mm-rel-title';
  head.textContent = 'Saran video';
  mmRelated.appendChild(head);
  for (const v of others) {
    const row = document.createElement('div');
    row.className = 'mm-rel-row';
    const thumb = API + '/api/thumb?token=' + encodeURIComponent(v.token);
    const media = API + '/api/media?token=' + encodeURIComponent(v.token);
    row.innerHTML =
      '<div class="mm-rel-thumb">' +
        '<img loading="lazy" src="' + thumb + '" alt="' + escapeHtml(v.name) + '" onerror="this.remove()">' +
        '<span class="mm-rel-play">&#9654;</span>' +
      '</div>' +
      '<div class="mm-rel-info">' +
        '<div class="mm-rel-name">' + escapeHtml(v.name) + '</div>' +
        '<div class="mm-rel-meta">' + fmt(v.size) + (v.modified > 0 ? ' \u00b7 ' + fmtDate(v.modified) : '') + '</div>' +
      '</div>';
    row.addEventListener('click', function () {
      openMedia(v, media);
    });
    mmRelated.appendChild(row);
  }
}

const mmSpeedBtn = document.getElementById('mmSpeedBtn');
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
let mmSpeedIdx = 2;
function mmResetSpeed() {
  mmSpeedIdx = 2;
  mmVideo.playbackRate = 1;
  mmSpeedBtn.textContent = '1\u00D7';
}
mmSpeedBtn.addEventListener('click', function () {
  mmSpeedIdx = (mmSpeedIdx + 1) % SPEEDS.length;
  mmVideo.playbackRate = SPEEDS[mmSpeedIdx];
  mmSpeedBtn.textContent = SPEEDS[mmSpeedIdx].toString() + '\u00D7';
  mmShowCtrl();
});

function mmLockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      const p = screen.orientation.lock('landscape');
      if (p && p.catch) p.catch(function () {});
    } else if (screen.lockOrientation) {
      screen.lockOrientation('landscape');
    }
  } catch (e) {}
}
function mmUnlockOrientation() {
  try {
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    else if (screen.unlockOrientation) screen.unlockOrientation();
  } catch (e) {}
}
mmFsBtn.addEventListener('click', function () {
  const el = mmPlayer;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    mmUnlockOrientation();
    if (exit) exit.call(document);
  } else if (req) {
    const p = req.call(el);
    if (p && p.then) {
      p.then(function () { mmLockLandscape(); }).catch(function () {});
    } else {
      mmLockLandscape();
    }
  }
});

mmPlayer.addEventListener('click', function (e) {
  if (e.target.closest('#mmCtrl')) return;
  const now = Date.now();
  const dt = now - mmLastTap;
  const prevX = mmLastTapX;
  mmLastTap = now;
  mmLastTapX = e.clientX;
  if (dt < 350 && Math.abs(e.clientX - prevX) < 80 && !mmVideo.paused) {
    clearTimeout(mmTapTimer);
    const d = mmVideo.duration || 0;
    if (d) {
      const delta = e.clientX < window.innerWidth / 2 ? -10 : 10;
      mmVideo.currentTime = Math.min(Math.max(mmVideo.currentTime + delta, 0), d);
      mmShowToast((delta > 0 ? '+10' : '-10') + ' dtk');
      mmSeekUI();
    }
    mmShowCtrl();
    return;
  }
  if (mmVideo.paused) {
    mmVideo.play();
    mmShowCtrl();
  } else {
    clearTimeout(mmTapTimer);
    mmTapTimer = setTimeout(function () {
      mmVideo.pause();
      mmShowCtrl();
    }, 220);
  }
});

mmPlayer.addEventListener('mousemove', mmShowCtrl);
mmPlayer.addEventListener('touchstart', function () { mmShowCtrl(); }, { passive: true });

// Gesture ala YouTube: kiri = kecerahan, kanan = volume
function mmCurBrightness() {
  const m = mmPlayer.style.filter.match(/brightness\(([\d.]+)\)/);
  return m ? parseFloat(m[1]) : 1;
}
function mmSetBrightness(v) {
  if (v >= 0.99) mmPlayer.style.filter = '';
  else mmPlayer.style.filter = 'brightness(' + v.toFixed(2) + ')';
}
mmPlayer.addEventListener('touchstart', function (e) {
  if (e.touches.length !== 1) { mmGesture = null; return; }
  const left = e.touches[0].clientX < window.innerWidth / 2;
  mmGesture = {
    side: left ? 'b' : 'v',
    startY: e.touches[0].clientY,
    startVal: left ? mmCurBrightness() : mmVideo.volume,
    active: false
  };
}, { passive: true });
mmPlayer.addEventListener('touchmove', function (e) {
  if (!mmGesture || e.touches.length !== 1) return;
  const dy = e.touches[0].clientY - mmGesture.startY;
  if (!mmGesture.active && Math.abs(dy) < 12) return;
  mmGesture.active = true;
  e.preventDefault();
  const delta = -dy / (window.innerHeight * 0.6);
  const val = Math.min(1, Math.max(0, mmGesture.startVal + delta));
  if (mmGesture.side === 'b') {
    mmSetBrightness(val);
    mmShowToast('\u{1F506} ' + Math.round(val * 100) + '%');
  } else {
    mmVideo.volume = val;
    mmShowToast('\u{1F50A} ' + Math.round(val * 100) + '%');
  }
}, { passive: false });
mmPlayer.addEventListener('touchend', function () { mmGesture = null; });

mmVideo.addEventListener('play', function () {
  mmPlayBtn.innerHTML = ICONS.pause;
  mmBigPlay.classList.add('hidden');
  mmShowCtrl();
});
mmVideo.addEventListener('pause', function () {
  mmPlayBtn.innerHTML = ICONS.play;
  mmBigPlay.classList.remove('hidden');
  saveVideoPos(mmCurrentToken);
  mmShowCtrl();
});
mmVideo.addEventListener('ended', function () {
  mmPlayBtn.innerHTML = ICONS.play;
  mmBigPlay.classList.remove('hidden');
  if (mmCurrentToken) {
    try { localStorage.removeItem(vposKey(mmCurrentToken)); } catch (e) {}
  }
  mmSeekUI();
  mmShowCtrl();
});
mmVideo.addEventListener('timeupdate', function () {
  mmSeekUI();
  const now = Date.now();
  if (now - mmLastSave > 5000) {
    mmLastSave = now;
    saveVideoPos(mmCurrentToken);
  }
});
mmVideo.addEventListener('progress', function () {
  mmUpdateBuffer();
});
mmVideo.addEventListener('loadedmetadata', function () {
  mmSeekUI();
  mmUpdateBuffer();
  const pos = mmCurrentToken ? loadVideoPos(mmCurrentToken) : 0;
  const d = mmVideo.duration || 0;
  if (pos >= 10 && d > 0 && pos < d - 10) {
    mmVideo.currentTime = pos;
    mmSeekUI();
    mmShowToast('Lanjutkan dari ' + mmFmtTime(pos));
  }
});
mmVideo.addEventListener('waiting', function () {
  mmSpinner.classList.remove('hidden');
});
mmVideo.addEventListener('playing', function () {
  mmSpinner.classList.add('hidden');
});
mmVideo.addEventListener('canplay', function () {
  mmSpinner.classList.add('hidden');
});

mmBody.addEventListener('click', function (e) {
  if (mmType === 'image' && e.target === mmBody) closeMedia();
});

let hasLoadedItems = false;
function showListSkeleton() {
  const box = document.getElementById('list');
  let html = '<div class="sk-list">';
  for (let i = 0; i < 3; i++) {
    html += '<div class="sk-item"><div class="sk-ico skeleton"></div><div class="sk-lines">' +
      '<div class="sk-line w60 skeleton"></div><div class="sk-line w40 skeleton"></div>' +
      '<div class="sk-line w80 skeleton"></div></div></div>';
  }
  box.innerHTML = html + '</div>';
}
async function refresh() {
  if (!hasLoadedItems) showListSkeleton();
  try {
    const res = await fetch(API + '/api/downloads');
    if (res.status === 401) {
      document.getElementById('status').textContent = 'PIN diperlukan. Muat ulang halaman untuk login.';
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    failCount = 0;
    hasLoadedItems = true;
    document.getElementById('status').textContent = '';
    document.getElementById('deviceStatus').classList.remove('offline');
    hideConnBanner();
    (data.items || []).forEach(sampleSpeed);
    render(data.items);
  } catch (e) {
    failCount++;
    if (failCount > 2) {
      document.getElementById('status').textContent = 'Tidak dapat terhubung ke server. Cek server di aplikasi.';
    }
  }
}

function fmt(bytes) {
  if (bytes < 1024) return bytes + ' B';
  const kb = bytes / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB';
  const mb = kb / 1024;
  if (mb < 1024) return mb.toFixed(1) + ' MB';
  return (mb / 1024).toFixed(2) + ' GB';
}

function fmtSpeed(bps) {
  if (bps < 1024) return bps + ' B/s';
  const kb = bps / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB/s';
  return (kb / 1024).toFixed(2) + ' MB/s';
}

const speedHistory = {};
function sampleSpeed(it) {
  if (it.state !== 'DOWNLOADING') {
    delete speedHistory[it.id];
    return;
  }
  const arr = speedHistory[it.id] || [];
  arr.push(it.speedBps);
  if (arr.length > 30) arr.shift();
  speedHistory[it.id] = arr;
}

function sparkSvg(arr) {
  if (!arr || arr.length < 2) return '';
  const w = 120;
  const h = 26;
  const max = Math.max.apply(null, arr) || 1;
  const pts = arr.map(function (v, i) {
    const x = Math.round((i / (arr.length - 1)) * (w - 4)) + 2;
    const y = h - 3 - Math.round((v / max) * (h - 6));
    return x + ',' + y;
  }).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    '<polyline points="' + pts + '"/></svg>';
}

function fmtEta(seconds) {
  if (seconds <= 0) return '0s';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return h + 'j ' + String(m).padStart(2, '0') + 'm';
  if (m > 0) return m + 'm ' + String(s).padStart(2, '0') + 's';
  return s + 's';
}

function stateLabel(s) {
  return {PENDING:'Menunggu', DOWNLOADING:'Mendownload', PAUSED:'Dijeda', COMPLETED:'Selesai', FAILED:'Gagal', CANCELLED:'Dibatalkan'}[s] || s;
}

function stateBadge(s) {
  const map = {PENDING:'b-paused', DOWNLOADING:'b-active', PAUSED:'b-paused', COMPLETED:'b-done', FAILED:'b-fail', CANCELLED:'b-fail'};
  return '<span class="badge ' + (map[s] || 'b-paused') + '">' + stateLabel(s) + '</span>';
}

function fileIcon(name) {
  const e = extOf(name).toLowerCase();
  if (['mp4','mkv','webm','avi','mov','3gp','m4v'].indexOf(e) >= 0) return '\u{1F3AC}';
  if (['jpg','jpeg','png','gif','webp','bmp'].indexOf(e) >= 0) return '\u{1F5BC}';
  if (['mp3','m4a','aac','wav','ogg','flac'].indexOf(e) >= 0) return '\u{1F3B5}';
  if (e === 'apk') return '\u{1F4E6}';
  if (e === 'pdf') return '\u{1F4C4}';
  if (['zip','rar','7z','tar','gz','xz'].indexOf(e) >= 0) return '\u{1F4E6}';
  if (['txt','md','log','csv'].indexOf(e) >= 0) return '\u{1F4C4}';
  return '\u{1F4CE}';
}

function renderSpeedTotal(items) {
  const el = document.getElementById('speedTotal');
  if (!el) return;
  let total = 0;
  let active = 0;
  items.forEach(function (it) {
    if (it.state === 'DOWNLOADING') {
      active++;
      if (it.speedBps > 0) total += it.speedBps;
    } else if (it.state === 'PENDING') {
      active++;
    }
  });
  if (!active) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.innerHTML = '&#9889; ' + fmtSpeed(total) + ' <span class="st-sub">' + active + ' aktif</span>';
}

// Toolbar aksi massal hanya tampil saat ada item yang relevan,
// supaya halaman tidak penuh tombol yang tidak terpakai.
function updateToolbar(items) {
  let active = 0;
  let pausedOrFailed = 0;
  let failed = 0;
  let completed = 0;
  items.forEach(function (it) {
    if (it.state === 'DOWNLOADING' || it.state === 'PENDING') active++;
    if (it.state === 'PAUSED' || it.state === 'FAILED') pausedOrFailed++;
    if (it.state === 'FAILED') failed++;
    if (it.state === 'COMPLETED') completed++;
  });
  document.getElementById('pauseAllBtn').classList.toggle('hidden', active === 0);
  document.getElementById('resumeAllBtn').classList.toggle('hidden', pausedOrFailed === 0);
  document.getElementById('retryFailedBtn').classList.toggle('hidden', failed === 0);
  document.getElementById('clearCompletedBtn').classList.toggle('hidden', completed === 0);
  document.getElementById('downloadsToolbar').classList.toggle(
    'hidden', active === 0 && pausedOrFailed === 0 && completed === 0
  );
}

let lastStructSig = '';
let lastIdListSig = '';
let lastRowSig = {};
// Signature struktural: hanya berubah saat daftar/status item berubah.
// Perubahan progres/kecepatan ditangani updateRows (tanpa render ulang penuh).
function structSig(items) {
  return items.map(function (it) {
    return it.id + '|' + it.state + '|' + (it.error ? '|e' : '') + '|' + it.fileName + '|' + it.addedAt;
  }).join(';');
}

function emptyHtml(icon, title, sub, cta) {
  return '<div class="empty"><span class="ico">' + icon + '</span>' +
    '<div class="t">' + title + '</div>' +
    (sub ? '<div class="s">' + sub + '</div>' : '') +
    (cta ? '<div class="cta"><button type="button" class="pill primary">' + cta + '</button></div>' : '') +
    '</div>';
}

function render(items) {
  const list = document.getElementById('list');
  currentItems = items.slice();
  const struct = (webFilter || '') + '::' + structSig(items);
  if (struct !== lastStructSig) {
    lastStructSig = struct;
    rebuildList(items);
    return;
  }
  updateRows(items);
}

function rowSubHtml(it) {
  const prog = it.totalBytes > 0 ? Math.round(it.bytesDownloaded * 100 / it.totalBytes) : 0;
  let meta = it.totalBytes > 0
    ? prog + '% \u00b7 ' + fmt(it.bytesDownloaded) + ' / ' + fmt(it.totalBytes)
    : fmt(it.bytesDownloaded);
  if (it.state === 'DOWNLOADING' && it.speedBps > 0) {
    meta += ' \u00b7 ' + fmtSpeed(it.speedBps);
    if (it.etaSeconds > 0) meta += ' \u00b7 ETA ' + fmtEta(it.etaSeconds);
  }
  const spark = it.state === 'DOWNLOADING' ? sparkSvg(speedHistory[it.id]) : '';
  return '<div class="item-sub">' +
    '<div class="meta">' + stateBadge(it.state) + '<span>' + meta + '</span></div>' +
    '<div class="bar"><div class="fill" style="width:' + prog + '%"></div></div>' +
    spark +
    '</div>';
}

// Update ringan: hanya progres/kecepatan/ETA yang berubah -> tidak render ulang
// seluruh daftar, dan baris yang tidak berubah di-skip (hemat DOM di HP lemah).
function updateRows(items) {
  const list = document.getElementById('list');
  if (!list.querySelector('li[data-id]')) {
    rebuildList(items);
    return;
  }
  const rows = {};
  list.querySelectorAll('li[data-id]').forEach(function (li) { rows[li.dataset.id] = li; });
  items.forEach(function (it) {
    const li = rows[it.id];
    if (!li) return;
    const sig = it.state + '|' + it.bytesDownloaded + '|' + it.speedBps + '|' + it.etaSeconds;
    if (lastRowSig[it.id] === sig) return;
    lastRowSig[it.id] = sig;
    const sub = li.querySelector('.item-sub');
    if (sub) sub.outerHTML = rowSubHtml(it);
  });
  renderSpeedTotal(items);
  updateToolbar(items);
}

function rebuildList(items) {
  lastRowSig = {};
  const list = document.getElementById('list');
  list.innerHTML = '';
  const idListSig = items.map(function (it) { return it.id + '|' + it.state; }).join(';');
  const idsChanged = idListSig !== lastIdListSig;
  const firstRender = lastIdListSig === '';
  lastIdListSig = idListSig;
  const STATE_ORDER = {DOWNLOADING:0, PENDING:1, PAUSED:2, FAILED:3, COMPLETED:4, CANCELLED:5};
  items = items.slice().sort(function (a, b) {
    const da = STATE_ORDER[a.state] != null ? STATE_ORDER[a.state] : 6;
    const db = STATE_ORDER[b.state] != null ? STATE_ORDER[b.state] : 6;
    const d = da - db;
    return d !== 0 ? d : ((b.addedAt || 0) - (a.addedAt || 0));
  });
  renderSpeedTotal(items);
  updateToolbar(items);
  const filtered = items.filter(function (it) {
    if (webFilter === 'ALL') return true;
    if (webFilter === 'ACTIVE') return it.state === 'DOWNLOADING' || it.state === 'PENDING';
    if (webFilter === 'COMPLETED') return it.state === 'COMPLETED';
    return it.state === 'FAILED' || it.state === 'CANCELLED';
  });
  if (!filtered.length) {
    if (items.length) {
      list.innerHTML = emptyHtml('\u{1F50D}', 'Tidak ada item di filter ini', 'Coba pilih filter lain.');
    } else {
      list.innerHTML = emptyHtml(
        '\u2B07\uFE0F',
        'Belum ada download',
        'Ketuk tombol + New Download untuk mulai.',
        'Tambah Download'
      );
      const cta = list.querySelector('.cta button');
      if (cta) cta.addEventListener('click', onNewDownloadClick);
    }
    return;
  }
  let idx = 0;
  for (const it of filtered) {
    const li = document.createElement('li');
    li.className = 'item';
    li.setAttribute('data-id', it.id);
    if (firstRender || idsChanged) {
      li.classList.add('anim');
      li.style.animationDelay = Math.min(idx * 40, 400) + 'ms';
    }
    idx++;
    const err = it.error ? '<div class="err">' + escapeHtml(it.error) + '</div>' : '';
    li.innerHTML =
      '<div class="item-top"><div class="icon">' + fileIcon(it.fileName) + '</div><div class="item-body">' +
      '<div class="name">' + escapeHtml(it.fileName) + '</div>' + err +
      '</div>' +
      '<button class="item-menu-btn" type="button" title="Aksi">\u22EF</button>' +
      '</div>' +
      rowSubHtml(it);
    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = actionButtons(it);
    li.appendChild(actions);
    li.querySelectorAll('[data-action]').forEach(b =>
      b.addEventListener('click', () => doAction(it.id, b.dataset.action))
    );
    const menuBtn = li.querySelector('.item-menu-btn');
    if (menuBtn) {
      menuBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        openItemSheet(it);
      });
    }
    list.appendChild(li);
  }
}

function actionButtons(it) {
  let s = '';
  const encId = encodeURIComponent(it.id);
  if (it.state === 'COMPLETED') {
    s += '<a class="stream" href="' + API + '/file/' + encId + '" target="_blank">&#9654; Stream</a>';
    s += '<a class="dl" href="' + API + '/file/' + encId + '?dl=1" download>&#11015; Download</a>';
    s += '<button data-action="share">&#128279; Bagikan</button>';
  }
  if (it.state === 'DOWNLOADING') s += '<button data-action="pause">&#9209; Jeda</button>';
  if (it.state === 'PAUSED' || it.state === 'FAILED') s += '<button data-action="resume">&#9654; Lanjut</button>';
  if (it.state === 'DOWNLOADING' || it.state === 'PENDING' || it.state === 'PAUSED') s += '<button data-action="cancel" class="danger">&#10005; Batal</button>';
  if (it.state === 'COMPLETED' || it.state === 'FAILED' || it.state === 'CANCELLED') s += '<button data-action="delete" class="danger">&#128465; Hapus</button>';
  return s;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const confirmModal = document.getElementById('confirmModal');
let confirmCb = null;
function showConfirm(title, text, yesLabel, cb) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmYes').textContent = yesLabel;
  confirmCb = cb;
  confirmModal.classList.remove('hidden');
}
function hideConfirm() {
  confirmModal.classList.add('hidden');
  confirmCb = null;
}
document.getElementById('confirmNo').addEventListener('click', hideConfirm);
document.getElementById('confirmYes').addEventListener('click', function () {
  const cb = confirmCb;
  hideConfirm();
  if (cb) cb();
});
confirmModal.addEventListener('click', function (e) {
  if (e.target === confirmModal) hideConfirm();
});

const inputModal = document.getElementById('inputModal');
let inputCb = null;
function showInput(title, value, hint, yesLabel, cb) {
  document.getElementById('inputTitle').textContent = title;
  document.getElementById('inputHint').textContent = hint || '';
  const field = document.getElementById('inputField');
  field.value = value || '';
  document.getElementById('inputYes').textContent = yesLabel || 'OK';
  inputCb = cb;
  inputModal.classList.remove('hidden');
  setTimeout(function () { field.focus(); field.select(); }, 80);
}
function hideInput() {
  inputModal.classList.add('hidden');
  inputCb = null;
}
document.getElementById('inputNo').addEventListener('click', hideInput);
document.getElementById('inputYes').addEventListener('click', function () {
  const cb = inputCb;
  const val = document.getElementById('inputField').value.trim();
  hideInput();
  if (cb) cb(val);
});
inputModal.addEventListener('click', function (e) {
  if (e.target === inputModal) hideInput();
});

function doAction(id, action) {
  if (action === 'delete') {
    const it = currentItems.find(function (x) { return x.id === id; });
    const label = it && it.fileName ? it.fileName : 'item ini';
    showConfirm('Hapus item?', 'Hapus \"' + label + '\" dari daftar download? File di device juga ikut terhapus.', 'Hapus', function () { doActionNow(id, action); });
    return;
  }
  if (action === 'clear_completed') {
    showConfirm('Bersihkan daftar selesai?', 'Semua item berstatus Selesai akan dikeluarkan dari daftar. File di device TIDAK ikut terhapus.', 'Bersihkan', function () { doActionNow(id, action); });
    return;
  }
  if (action === 'share') {
    shareItem(id);
    return;
  }
  doActionNow(id, action);
}
async function doActionNow(id, action, extra) {
  const body = new URLSearchParams({id: id, action: action});
  if (extra) {
    Object.entries(extra).forEach(function (e) { body.append(e[0], e[1]); });
  }
  await fetch(API + '/api/action', {method: 'POST', body});
  refresh();
}

const shareModal = document.getElementById('shareModal');
async function shareItem(id) {
  const body = new URLSearchParams({id: id});
  try {
    const res = await fetch(API + '/api/share', {method: 'POST', body});
    const data = await res.json();
    if (!data || !data.ok) {
      showConfirm('Gagal membuat tautan', (data && data.error) || 'File tidak ditemukan.', 'OK', function () {});
      return;
    }
    const url = location.origin + '/share/' + data.token;
    document.getElementById('shareText').textContent =
      'Tautan berlaku ' + data.expiresInHours + ' jam. Siapa pun yang memegang tautan ini bisa mengunduh file tanpa PIN.';
    document.getElementById('shareLink').value = url;
    document.getElementById('shareQr').src = API + '/api/qr?text=' + encodeURIComponent(url);
    shareModal.classList.remove('hidden');
  } catch (e) {
    showConfirm('Gagal membuat tautan', String(e), 'OK', function () {});
  }
}
function closeShare() {
  shareModal.classList.add('hidden');
  document.getElementById('shareQr').removeAttribute('src');
}
document.getElementById('shareClose').addEventListener('click', closeShare);
shareModal.addEventListener('click', function (e) {
  if (e.target === shareModal) closeShare();
});
document.getElementById('shareCopy').addEventListener('click', function () {
  const link = document.getElementById('shareLink');
  link.focus();
  link.select();
  let copied = false;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link.value).then(function () { copied = true; }).catch(function () {});
  }
  if (!copied) {
    try { document.execCommand('copy'); } catch (e) {}
  }
});
document.getElementById('shareOpen').addEventListener('click', function () {
  const link = document.getElementById('shareLink').value;
  if (link) window.open(link, '_blank');
});

function globalAction(action) {
  doAction('', action);
}

document.getElementById('pauseAllBtn').addEventListener('click', function () { globalAction('pause_all'); });
document.getElementById('resumeAllBtn').addEventListener('click', function () { globalAction('resume_all'); });
document.getElementById('retryFailedBtn').addEventListener('click', function () { globalAction('retry_failed'); });
document.getElementById('clearCompletedBtn').addEventListener('click', function () { globalAction('clear_completed'); });

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  const body = new URLSearchParams({url: url});
  const name = document.getElementById('name').value.trim();
  if (name) body.append('name', name);
  body.append('speedLimitKbps', document.getElementById('speed').value);
  body.append('priority', document.getElementById('priority').value);
  const checksum = document.getElementById('checksum').value.trim();
  if (checksum) body.append('checksum', checksum);
  body.append('path', document.getElementById('storage').value.trim());
  await fetch(API + '/api/add', {method: 'POST', body});
  document.getElementById('url').value = '';
  document.getElementById('name').value = '';
  toggleAddForm(false);
  refresh();
});

window.addEventListener('hashchange', applyRoute);
applyRoute();
refreshStatus();
let sse = null;
let sseFailCount = 0;
let lastSseAt = 0;
function connectEvents() {
  if (sse) { try { sse.close(); } catch (e) {} }
  sse = new EventSource(API + '/api/events');
  sse.onopen = function () { sseFailCount = 0; lastSseAt = Date.now(); hideConnBanner(); };
  sse.onmessage = function (ev) {
    sseFailCount = 0;
    lastSseAt = Date.now();
    hasLoadedItems = true;
    document.getElementById('deviceStatus').classList.remove('offline');
    try {
      const data = JSON.parse(ev.data);
      if (data.shutdown) {
        showConnBanner('Server dihentikan atau port berubah. Cek aplikasi → Remote (HTTP) untuk alamat baru.');
        return;
      }
      const items = data.items || [];
      if (data.status) renderStatus(data.status);
      items.forEach(sampleSpeed);
      render(items);
    } catch (e) {}
  };
  sse.onerror = function () {
    sseFailCount++;
    if (sseFailCount > 2) {
      document.getElementById('deviceStatus').classList.add('offline');
      showConnBanner('Koneksi realtime terputus. Cek server di aplikasi masih hidup.');
    }
  };
}
if (typeof EventSource !== 'undefined') {
  connectEvents();
  // Watchdog: SSE tidak tersambung ATAU diam >8 dtk (koneksi macet diam-diam,
  // mis. WebView/Chrome membekukan tab) -> ambil ulang data tanpa reload halaman.
  // Saat normal (SSE hidup & ada frame tiap ~2 dtk) watchdog tidak aktif sama sekali.
  setInterval(function () {
    const alive = sse && sse.readyState === EventSource.OPEN &&
      (Date.now() - lastSseAt) < 8000;
    if (alive) return;
    if (currentRoute() === 'downloads') refresh();
    refreshStatus();
  }, 2500);
} else {
  setInterval(function () {
    if (currentRoute() === 'downloads') refresh();
    refreshStatus();
  }, 1500);
}
